<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f14">
<title>Python 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f14;--surface:#1a1a24;--surface2:#22222f;--border:#2e2e3e;--accent:#7c6ff7;--accent2:#a89cf7;--green:#4ade80;--green-bg:#0d2b1a;--red:#f87171;--red-bg:#2b0d0d;--amber:#fbbf24;--text:#e8e8f0;--muted:#7070a0;--mono:'DM Mono',monospace;--sans:'Noto Sans KR',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100dvh;overscroll-behavior:none;}

/* ── 홈 ── */
#screen-home{min-height:100dvh;display:flex;flex-direction:column;padding:2.5rem 1.5rem 2rem;}
.home-top{flex:1;display:flex;flex-direction:column;justify-content:center;}
.logo{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:1.25rem;}
.home-title{font-size:clamp(2rem,8vw,2.8rem);font-weight:700;line-height:1.15;margin-bottom:.5rem;background:linear-gradient(135deg,#e8e8f0 40%,var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.home-sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:1.75rem;}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem;}
.stat-box{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:.75rem .5rem;text-align:center;}
.stat-num{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--accent2);display:block;margin-bottom:3px;}
.stat-label{font-size:11px;color:var(--muted);}
.section-label{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem;}
.tag-btn{padding:5px 12px;font-size:11px;font-family:var(--mono);border:.5px solid var(--border);border-radius:99px;background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s;}
.tag-btn.active{background:rgba(124,111,247,.15);border-color:var(--accent);color:var(--accent2);}
.tag-all.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.tag-wrong.active{background:rgba(248,113,113,.15);border-color:var(--red);color:var(--red);}
.n-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:1.5rem;}
.n-btn{background:var(--surface);border:.5px solid var(--border);border-radius:10px;padding:9px 0;font-size:12px;font-family:var(--mono);color:var(--muted);cursor:pointer;transition:all .15s;}
.n-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.start-btn{width:100%;padding:1rem;background:var(--accent);border:none;border-radius:14px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;font-family:var(--sans);transition:opacity .15s,transform .1s;}
.start-btn:active{opacity:.85;transform:scale(.98);}

/* ── 퀴즈 ── */
#screen-quiz{display:none;min-height:100dvh;flex-direction:column;}
.quiz-header{padding:1rem 1.25rem .75rem;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:.5px solid var(--border);}
.progress-bg{flex:1;height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease;}
.hdr-score{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;}
.hdr-num{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;}
.quiz-body{flex:1;padding:1.25rem 1.25rem 6rem;overflow-y:auto;}
.unit-label{font-size:10px;font-family:var(--mono);color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem;display:flex;align-items:center;gap:6px;}
.unit-label::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.6;}
.wrong-count-badge{font-size:10px;font-family:var(--mono);color:var(--red);background:var(--red-bg);border:.5px solid var(--red);border-radius:99px;padding:2px 7px;margin-left:auto;}
.type-chip{display:inline-flex;align-items:center;font-size:10px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:99px;margin-bottom:1rem;border:.5px solid;}
.chip-mc{color:var(--accent2);border-color:var(--accent);background:rgba(124,111,247,.1);}
.chip-fill{color:#5eead4;border-color:#0d9488;background:rgba(20,184,166,.1);}
.chip-ox{color:var(--amber);border-color:#b45309;background:rgba(251,191,36,.1);}
.q-text{font-size:15px;font-weight:500;line-height:1.65;color:var(--text);margin-bottom:.5rem;white-space:pre-wrap;}
.q-code{background:var(--surface2);border:.5px solid var(--border);border-radius:10px;padding:.875rem 1rem;font-family:var(--mono);font-size:12.5px;color:#c0c0e0;margin:.75rem 0 1.25rem;line-height:1.7;white-space:pre;overflow-x:auto;}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:.25rem;}
.choice{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:.875rem 1rem;font-size:14px;color:var(--text);text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .12s,border-color .12s;font-family:var(--sans);}
.choice:active:not(:disabled){background:var(--surface2);}
.choice-lbl{width:26px;height:26px;border-radius:7px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);flex-shrink:0;}
.choice.correct{background:var(--green-bg);border-color:var(--green);}
.choice.correct .choice-lbl{background:var(--green);color:#000;}
.choice.wrong{background:var(--red-bg);border-color:var(--red);}
.choice.wrong .choice-lbl{background:var(--red);color:#000;}
.choice:disabled{cursor:default;}
.ox-row{display:flex;gap:12px;margin-top:.25rem;}
.ox-btn{flex:1;padding:1.5rem 0;font-size:26px;background:var(--surface);border:.5px solid var(--border);border-radius:16px;cursor:pointer;transition:background .12s;display:flex;flex-direction:column;align-items:center;gap:6px;}
.ox-btn span{font-size:12px;font-family:var(--mono);color:var(--muted);}
.ox-btn:active:not(:disabled){background:var(--surface2);}
.ox-btn.correct{background:var(--green-bg);border-color:var(--green);}
.ox-btn.wrong{background:var(--red-bg);border-color:var(--red);}
.ox-btn:disabled{cursor:default;}
.fill-wrap{margin-top:.25rem;display:flex;flex-direction:column;gap:10px;}
.fill-input{width:100%;background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:.875rem 1rem;font-size:15px;font-family:var(--mono);color:var(--text);outline:none;transition:border-color .15s;}
.fill-input:focus{border-color:var(--accent);}
.fill-input:disabled{opacity:.6;}
.confirm-btn{width:100%;padding:.875rem;background:var(--surface2);border:.5px solid var(--border);border-radius:12px;font-size:15px;font-weight:500;color:var(--text);cursor:pointer;font-family:var(--sans);}
.feedback-box{margin-top:1rem;padding:1rem;border-radius:12px;font-size:13px;line-height:1.7;display:none;border:.5px solid;}
.feedback-box.correct{background:var(--green-bg);border-color:#166534;color:#bbf7d0;}
.feedback-box.wrong{background:var(--red-bg);border-color:#7f1d1d;color:#fecaca;}
.fb-title{font-weight:700;margin-bottom:6px;font-size:14px;}
.fb-ans{margin-bottom:5px;opacity:.85;font-family:var(--mono);}
.fb-exp{opacity:.8;}
.quiz-footer{position:fixed;bottom:0;left:0;right:0;padding:1rem 1.25rem calc(1rem + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 80%,transparent);}
.next-btn{width:100%;padding:1rem;background:var(--accent);border:none;border-radius:14px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;font-family:var(--sans);display:none;transition:opacity .15s,transform .1s;}
.next-btn:active{opacity:.85;transform:scale(.98);}

/* ── 결과 ── */
#screen-result{display:none;min-height:100dvh;flex-direction:column;padding:3rem 1.5rem 2rem;}
.result-emoji{font-size:52px;margin-bottom:1rem;text-align:center;}
.result-score-big{font-family:var(--mono);font-size:clamp(3rem,15vw,5rem);font-weight:500;color:var(--accent2);text-align:center;line-height:1;}
.result-denom{font-size:1.5rem;color:var(--muted);}
.result-pct{text-align:center;font-size:14px;color:var(--muted);font-family:var(--mono);margin:.5rem 0 1rem;}
.result-msg{text-align:center;font-size:15px;color:var(--text);margin-bottom:1.75rem;line-height:1.6;}
.result-btns{display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem;}
.btn-retry{padding:1rem;background:var(--accent);border:none;border-radius:14px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;font-family:var(--sans);}
.btn-home{padding:1rem;background:var(--surface);border:.5px solid var(--border);border-radius:14px;font-size:15px;color:var(--muted);cursor:pointer;font-family:var(--sans);}

/* ── 오답 선택 & 복사 ── */
.wrong-section{border-top:.5px solid var(--border);padding-top:1.5rem;}
.wrong-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.wrong-section-title{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--mono);}
.select-all-btn{font-size:12px;font-family:var(--mono);color:var(--accent2);background:none;border:none;cursor:pointer;padding:4px 8px;}
.wrong-items-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem;}
.wrong-item-card{background:var(--surface);border:.5px solid var(--border);border-radius:10px;padding:.75rem 1rem;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:border-color .15s;}
.wrong-item-card.selected{border-color:var(--accent);background:rgba(124,111,247,.08);}
.wrong-item-check{width:20px;height:20px;border-radius:5px;border:.5px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-size:11px;}
.wrong-item-card.selected .wrong-item-check{background:var(--accent);border-color:var(--accent);color:#fff;}
.wrong-item-content{flex:1;}
.wrong-item-unit{font-size:10px;font-family:var(--mono);color:var(--muted);margin-bottom:3px;}
.wrong-item-q{font-size:13px;color:var(--text);line-height:1.5;}
.wrong-item-cnt{font-size:10px;font-family:var(--mono);color:var(--red);margin-top:3px;}
.copy-selected-btn{width:100%;padding:.875rem;background:rgba(124,111,247,.15);border:.5px solid var(--accent);border-radius:12px;font-size:14px;font-weight:500;color:var(--accent2);cursor:pointer;font-family:var(--sans);transition:background .15s;display:none;}
.copy-selected-btn.visible{display:block;}
.copy-selected-btn:active{background:rgba(124,111,247,.25);}

/* ── 오답 노트 화면 ── */
#screen-wrongnote{display:none;min-height:100dvh;flex-direction:column;}
.note-header{padding:1rem 1.25rem;display:flex;align-items:center;gap:12px;border-bottom:.5px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;}
.note-back{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px;}
.note-title{font-size:15px;font-weight:500;color:var(--text);}
.note-body{flex:1;padding:1.25rem;overflow-y:auto;padding-bottom:4rem;}
.note-empty{text-align:center;color:var(--muted);font-size:14px;margin-top:3rem;line-height:1.8;}
.note-item{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:10px;}
.note-item-top{display:flex;align-items:center;gap:8px;margin-bottom:.5rem;}
.note-item-unit{font-size:10px;font-family:var(--mono);color:var(--muted);}
.note-item-cnt{font-size:11px;font-family:var(--mono);color:var(--red);background:var(--red-bg);border:.5px solid var(--red);border-radius:99px;padding:2px 8px;margin-left:auto;}
.note-item-q{font-size:13px;color:var(--text);line-height:1.5;margin-bottom:.5rem;}
.note-item-ans{font-size:12px;font-family:var(--mono);color:var(--green);opacity:.8;}
</style>
</head>
<body>

<!-- ── 홈 ── -->
<div id="screen-home">
  <div class="home-top">
    <div class="logo">🐍 Python Quiz</div>
    <h1 class="home-title">Python<br>기초 문법</h1>
    <p class="home-sub">객관식 · 빈칸 · OX · 출력예측<br>총 296문제 랜덤 출제</p>
    <div class="stat-row">
      <div class="stat-box"><span class="stat-num">296</span><span class="stat-label">총 문제</span></div>
      <div class="stat-box"><span class="stat-num" id="wrong-count-home">0</span><span class="stat-label">오답 누적</span></div>
      <div class="stat-box"><span class="stat-num" id="best-score">—</span><span class="stat-label">최고점수</span></div>
    </div>

    <div class="section-label">모드</div>
    <div class="tag-row" id="tag-row">
      <button class="tag-btn tag-all active" onclick="toggleTag('all',this)">전체</button>
      <button class="tag-btn tag-wrong" onclick="toggleTag('wrong',this)">❌ 오답만</button>
      <button class="tag-btn" onclick="toggleTag('flowchart',this)">순서도</button>
      <button class="tag-btn" onclick="toggleTag('dtype',this)">자료형</button>
      <button class="tag-btn" onclick="toggleTag('func',this)">함수</button>
      <button class="tag-btn" onclick="toggleTag('dict',this)">딕셔너리</button>
      <button class="tag-btn" onclick="toggleTag('string',this)">문자열</button>
      <button class="tag-btn" onclick="toggleTag('list',this)">리스트</button>
      <button class="tag-btn" onclick="toggleTag('loop',this)">반복문</button>
      <button class="tag-btn" onclick="toggleTag('basic',this)">기초문법</button>
      <button class="tag-btn" onclick="toggleTag('file',this)">파일/기타</button>
      <button class="tag-btn" onclick="toggleTag('hangman',this)">행맨</button>
    </div>

    <div class="section-label">문제 수</div>
    <div class="n-row">
      <button class="n-btn" onclick="setN(10,this)">10</button>
      <button class="n-btn active" onclick="setN(20,this)">20</button>
      <button class="n-btn" onclick="setN(50,this)">50</button>
      <button class="n-btn" onclick="setN(100,this)">100</button>
      <button class="n-btn" onclick="setN(9999,this)">전부</button>
    </div>

    <button class="tag-btn" style="margin-bottom:1rem;width:100%;text-align:center;padding:10px;" onclick="showWrongNote()">📒 오답 노트 보기</button>
  </div>
  <button class="start-btn" onclick="startQuiz()">시작하기</button>
</div>

<!-- ── 퀴즈 ── -->
<div id="screen-quiz">
  <div class="quiz-header">
    <span class="hdr-num" id="hdr-num">1/20</span>
    <div class="progress-bg"><div class="progress-fill" id="prog" style="width:5%"></div></div>
    <span class="hdr-score" id="hdr-score">0점</span>
  </div>
  <div class="quiz-body" id="quiz-body"></div>
  <div class="quiz-footer">
    <button class="next-btn" id="next-btn" onclick="nextQ()">다음 문제 →</button>
  </div>
</div>

<!-- ── 결과 ── -->
<div id="screen-result">
  <div class="result-emoji" id="res-emoji">🏆</div>
  <div class="result-score-big" id="res-score">0<span class="result-denom">/20</span></div>
  <div class="result-pct" id="res-pct">정답률 0%</div>
  <div class="result-msg" id="res-msg"></div>
  <div class="result-btns">
    <button class="btn-retry" onclick="retryQuiz()">같은 설정으로 다시 풀기</button>
    <button class="btn-home" onclick="goHome()">홈으로</button>
  </div>
  <div class="wrong-section" id="wrong-section"></div>
</div>

<!-- ── 오답 노트 ── -->
<div id="screen-wrongnote">
  <div class="note-header">
    <button class="note-back" onclick="show('screen-home')">←</button>
    <span class="note-title">📒 오답 노트</span>
  </div>
  <div class="note-body" id="note-body"></div>
</div>

<script>
// ══ 태그 한글명 ══
const TAG_NAMES = {
  string:'문자열', list:'리스트', loop:'반복문',
  basic:'기초문법', file:'파일/기타', hangman:'행맨',
  func:'함수', dict:'딕셔너리', flowchart:'순서도·자료형', dtype:'자료형'
};

const ALL_Q = [
  // ── 기초문법 ────────────────────────────────────────────────
  {type:"mc",tag:"basic",q:"다음 중 정수형(int)을 올바르게 선언한 것은?",choices:["a = '3'","a = 3.0","a = 3","a = True"],ans:2,exp:"따옴표 없이 정수를 쓰면 int 타입이에요. 3.0은 float, True는 bool입니다."},
  {type:"mc",tag:"basic",q:"함수를 정의할 때 사용하는 키워드는?",choices:["func","define","def","function"],ans:2,exp:"Python에서는 def 키워드로 함수를 정의해요."},
  {type:"mc",tag:"basic",q:"다음 중 불변(immutable) 자료형은?",choices:["list","dict","set","tuple"],ans:3,exp:"tuple은 한 번 만들면 변경할 수 없는 불변 자료형이에요."},
  {type:"mc",tag:"basic",q:"변수의 타입을 확인하는 함수는?",choices:["typeof()","type()","isinstance()","class()"],ans:1,exp:"type(변수)로 타입을 확인해요."},
  {type:"mc",tag:"basic",q:"다음 중 주석을 작성하는 방법은?",choices:["// 주석","/* 주석 */","# 주석","-- 주석"],ans:2,exp:"Python에서 한 줄 주석은 #으로 시작해요."},
  {type:"mc",tag:"basic",q:"함수에서 값을 반환할 때 쓰는 키워드는?",choices:["give","send","yield","return"],ans:3,exp:"return으로 함수의 결과값을 반환해요."},
  {type:"mc",tag:"basic",q:"다음 중 논리 연산자가 아닌 것은?",choices:["and","or","not","xor"],ans:3,exp:"Python 논리 연산자는 and, or, not이에요."},
  {type:"mc",tag:"basic",q:"모듈을 가져올 때 사용하는 키워드는?",choices:["include","require","import","load"],ans:2,exp:"import 키워드로 모듈을 가져와요."},
  {type:"mc",tag:"basic",q:"숫자를 문자열로 변환하는 함수는?",choices:["string()","tostr()","str()","convert()"],ans:2,exp:"str(숫자)로 문자열로 변환해요."},
  {type:"mc",tag:"basic",q:"None의 타입은?",choices:["&lt;class 'null'&gt;","&lt;class 'NoneType'&gt;","&lt;class 'undefined'&gt;","&lt;class 'bool'&gt;"],ans:1,exp:"None의 타입은 NoneType이에요."},
  {type:"mc",tag:"basic",q:"lambda x: x * 2에 5를 전달하면 결과는?",choices:["2","5","10","오류"],ans:2,exp:"lambda x: x * 2에 5를 전달하면 5 * 2 = 10이에요."},
  {type:"mc",tag:"basic",q:"str(2)의 결과는?",choices:["2 (정수)","'2' (문자열)","오류","None"],ans:1,exp:"str()은 숫자를 문자열로 변환해요. str(2) = '2'예요."},
  {type:"ox",tag:"basic",q:"Python의 튜플(tuple)은 한 번 만들면 원소를 변경할 수 없다.",ans:"O",exp:"튜플은 불변(immutable) 자료형이에요."},
  {type:"ox",tag:"basic",q:"Python에서 들여쓰기는 스타일 권고일 뿐, 문법적으로 강제되지 않는다.",ans:"X",exp:"Python은 들여쓰기가 문법이에요!"},
  {type:"ox",tag:"basic",q:"Python에서 // 연산자는 나머지를 구한다.",ans:"X",exp:"//는 정수 나눗셈(몫)이에요. 나머지는 %를 씁니다."},

  {type:"ox",tag:"dtype",q:"list는 수정(추가, 삭제, 변경)이 불가능하다.",ans:"X",exp:"list는 mutable(수정 가능)한 자료형이에요."},
  {type:"ox",tag:"dtype",q:"bool 타입에서 True는 1, False는 0과 같다.",ans:"O",exp:"Python에서 bool은 int의 서브클래스라 True==1, False==0이에요."},
  {type:"ox",tag:"dtype",q:"set은 순서가 있어서 인덱싱이 가능하다.",ans:"X",exp:"set은 순서가 없어서 인덱싱(set[0])이 불가능해요."},

  {type:"fill",tag:"dtype",q:"키-값 쌍을 저장하는 자료형:\n\nd = {'name': '예지', 'age': 25}\ntype(d) → ______",ans:["dict","&lt;class 'dict'&gt;"],disp:"dict",exp:"딕셔너리(dict)는 키-값 쌍으로 데이터를 저장해요."},
  {type:"fill",tag:"dtype",q:"중복을 제거하고 싶을 때 쓰는 자료형:\n\na = [1, 1, 2, 2, 3]\nb = _______(a)\nprint(b)  # {1, 2, 3}",ans:["set"],disp:"set",exp:"set()으로 변환하면 중복이 제거돼요."},

  {type:"ox",tag:"list",q:"a = [1,2,3]일 때 a.pop(0)은 1을 반환하고 a는 [2,3]이 된다.",ans:"O",exp:"pop(인덱스)는 해당 인덱스 원소를 꺼내며 제거해요."},

  {type:"fill",tag:"list",q:"리스트 오름차순 정렬(원본 변경):\n\na = [3, 1, 2]\na._______()\nprint(a)  # [1, 2, 3]",ans:["sort"],disp:"sort",exp:"sort()는 원본 리스트를 직접 정렬해요."},
  {type:"fill",tag:"list",q:"빈 리스트를 만드는 두 가지 방법 중 하나:\n\na = ______",ans:["[]","list()"],disp:"[]  또는  list()",exp:"[]나 list()로 빈 리스트를 만들 수 있어요."},
  {type:"mc",tag:"list",q:"a = ['a','b','c']일 때 a[1:3]은?",choices:["['a','b']","['b','c']","['a','b','c']","오류"],ans:1,exp:"슬라이싱 [1:3]은 인덱스 1 이상 3 미만이에요. ['b','c']예요."},

  {type:"mc",tag:"func",q:"파이썬에서 함수를 정의할 때 사용하는 키워드는?",choices:["function","fn","define","def"],ans:3,exp:"파이썬은 def 키워드로 함수를 정의해요."},

  {type:"mc",tag:"func",q:"add(3, 5)에서 3, 5는 무엇인가?",choices:["매개변수(parameter)","반환값(return value)","인수(argument)","지역변수(local variable)"],ans:2,exp:"함수를 호출할 때 실제로 전달하는 3, 5는 인수(argument)예요."},
  {type:"mc",tag:"func",q:"함수 호출 결과를 변수에 저장하려면 반드시 필요한 것은?",choices:["print()","input()","return","def"],ans:2,exp:"return이 있어야 함수 밖에서 값을 사용할 수 있어요."},

  {type:"mc",tag:"func",q:"전역변수(global variable)의 특징은?",choices:["함수 안에서만 유효","모든 함수에서 읽기 가능","함수 안에서는 읽을 수 없음","반드시 return으로 반환해야 함"],ans:1,exp:"전역변수는 함수 밖에서 정의되며 모든 함수에서 읽을 수 있어요."},

  {type:"mc",tag:"func",q:"def f(a, b, c): return a*b*c 일 때 f(1, 3, 5)의 결과는?",choices:["9","15","8","오류"],ans:1,exp:"1 * 3 * 5 = 15예요."},

  {type:"ox",tag:"func",q:"def f(a): print(a)처럼 return이 없는 함수의 반환값은 None이다.",ans:"O",exp:"return이 없거나 return만 있으면 None이 반환돼요."},
  {type:"ox",tag:"func",q:"print(f)와 print(f())는 같은 결과를 출력한다.",ans:"X",exp:"print(f)는 함수 주소, print(f())는 함수 실행 결과를 출력해요."},
  {type:"ox",tag:"func",q:"파이썬 함수의 매개변수 개수에는 제한이 없다.",ans:"O",exp:"파이썬은 매개변수 개수에 제한이 없어요. 단, 3~4개 이상이면 딕셔너리로 묶는 것을 권장해요."},

  {type:"mc",tag:"dict",q:"d = {'name':'예지','age':25}에서 d['name']은?",choices:["25","'예지'","오류","None"],ans:1,exp:"d['name']은 키 'name'에 해당하는 값 '예지'를 반환해요."},

  {type:"mc",tag:"dict",q:"country_list = ['미국','중국','일본']\ncountry_list.index('중국')의 결과는?",choices:["0","1","2","오류"],ans:1,exp:"index()는 해당 값의 인덱스를 반환해요. '중국'은 인덱스 1이에요."},
  {type:"mc",tag:"dict",q:"딕셔너리에서 '키가 있는지' 확인하는 방법은?",choices:["key in d","d.find(key)","d.has(key)","d.search(key)"],ans:0,exp:"'키 in 딕셔너리'로 키가 있는지 True/False로 확인해요."},

  {type:"mc",tag:"dict",q:"d['planet']와 d[planet]의 차이는?",choices:["같음","d['planet']는 문자열 키, d[planet]는 변수 키","d[planet]는 문자열 키, d['planet']는 변수 키","둘 다 오류"],ans:1,exp:"따옴표가 있으면 문자열 자체가 키, 없으면 변수에 담긴 값이 키예요."},
  {type:"ox",tag:"dict",q:"딕셔너리 키는 중복될 수 없다.",ans:"O",exp:"같은 키가 두 번 있으면 나중 값이 앞 값을 덮어써요."},

  {type:"ox",tag:"dict",q:"딕셔너리에서 존재하지 않는 키로 접근하면 None을 반환한다.",ans:"X",exp:"존재하지 않는 키로 접근하면 KeyError가 발생해요. None을 원하면 d.get(key)를 써요."},

  {type:"mc",tag:"dict",q:"d = {}일 때 d['score'] = 100 실행 후 d는?",choices:["{}","{'score': 100}","오류","None"],ans:1,exp:"빈 딕셔너리에 d['score'] = 100으로 새 키-값을 추가할 수 있어요."},

  {type:"fill",tag:"loop",q:"인덱스와 값을 동시에 얻는 내장 함수:\n\nfor i, v in _________(my_list):\n    print(i, v)",ans:["enumerate"],disp:"enumerate",exp:"enumerate(리스트)는 (인덱스, 값) 쌍을 반환해요."},
  {type:"mc",tag:"loop",q:"다음 코드의 출력 결과는?\n\nfor i in range(3):\n    for j in range(3):\n        if i == j:\n            print(i)",choices:["0 1 2","0","0\\n1\\n2","0 0"],ans:2,exp:"i==j가 True인 경우는 (0,0),(1,1),(2,2)이에요. 0,1,2가 각각 출력돼요."},
  {type:"mc",tag:"loop",q:"while 루프에서 조건이 처음부터 False면 몇 번 실행되나?",choices:["1번","무한번","0번","오류"],ans:2,exp:"while 조건이 처음부터 False면 루프 내부가 한 번도 실행되지 않아요."},

  // ── 기초문법 심화 (basic) ────────────────────────────────────
  {type:"mc",tag:"basic",q:"a = 5, b = 3일 때 a % b는?",choices:["1","2","5","0"],ans:1,exp:"% 는 나머지 연산이에요. 5 ÷ 3 = 1 나머지 2, 결과는 2예요."},
  {type:"mc",tag:"basic",q:"a = 5, b = 3일 때 a // b는?",choices:["1.66","1","2","5"],ans:1,exp:"// 는 정수 나눗셈(몫)이에요. 5 // 3 = 1이에요."},
  {type:"mc",tag:"basic",q:"2 ** 10의 결과는?",choices:["20","100","1024","512"],ans:2,exp:"** 는 거듭제곱이에요. 2^10 = 1024예요."},
  {type:"mc",tag:"basic",q:"a = 10, a += 3 후 a는?",choices:["3","10","13","30"],ans:2,exp:"a += 3 은 a = a + 3이에요. 10 + 3 = 13이에요."},
  {type:"mc",tag:"basic",q:"if 5 > 3 and 2 < 1: 의 결과는?",choices:["True","False","오류","None"],ans:1,exp:"and는 두 조건 모두 True여야 True예요. 2 < 1이 False라 False예요."},
  {type:"mc",tag:"basic",q:"if 5 > 3 or 2 < 1: 의 결과는?",choices:["True","False","오류","None"],ans:0,exp:"or는 하나만 True이면 True예요. 5>3이 True라 True예요."},
  {type:"mc",tag:"basic",q:"not True의 결과는?",choices:["True","False","None","1"],ans:1,exp:"not은 논리값을 뒤집어요. not True = False예요."},
  {type:"mc",tag:"basic",q:"a = 5\nif a > 3:\n    print('크다')\nelse:\n    print('작다')\n의 출력은?",choices:["크다","작다","오류","None"],ans:0,exp:"5 > 3은 True이므로 '크다'가 출력돼요."},
  {type:"ox",tag:"basic",q:"== 는 같음을 비교하고, = 는 값을 할당한다.",ans:"O",exp:"=은 대입(할당), ==은 비교 연산자예요."},
  {type:"ox",tag:"basic",q:"파이썬에서 들여쓰기(indentation)는 코드 블록을 구분하는 데 사용된다.",ans:"O",exp:"파이썬은 중괄호 대신 들여쓰기로 코드 블록을 구분해요."},
  {type:"fill",tag:"basic",q:"나머지를 구하는 연산자:\n\n5 ___ 2 = 1",ans:["%"],disp:"%",exp:"% 는 나머지 연산자예요."},
  {type:"fill",tag:"basic",q:"정수 나눗셈(몫)을 구하는 연산자:\n\n7 ___ 2 = 3",ans:["//"],disp:"//",exp:"// 는 소수점을 버리는 정수 나눗셈이에요."},

  // ── 오답패턴: result += vs append ──────────────────────
  {type:"mc",tag:"string",q:"result = ''일 때 문자를 추가하는 올바른 방법은?",choices:["result.append('a')","result += 'a'","result.add('a')","result.insert('a')"],ans:1,exp:"문자열에는 += 를 써요. append()는 리스트에서만 써요!"},
  {type:"mc",tag:"list",q:"result = []일 때 원소를 추가하는 올바른 방법은?",choices:["result += 'a'","result + 'a'","result.append('a')","result.add('a')"],ans:2,exp:"리스트에는 append()를 써요."},
  {type:"ox",tag:"string",q:"result = ''일 때 result.append('a')는 정상 작동한다.",ans:"X",exp:"append()는 리스트 메서드예요. 문자열에 쓰면 AttributeError가 발생해요."},
];

// ══ localStorage 키 ══
const STORAGE_WRONG = 'pq_wrong_counts'; // {qIndex: count}
const STORAGE_BEST  = 'pq_best';

let TOTAL=20, selectedTags=new Set(['all']), questions=[], current=0, score=0, answered=false, wrongQ=[];
let wrongCounts = {};

function loadData(){
  try{ wrongCounts = JSON.parse(localStorage.getItem(STORAGE_WRONG)||'{}'); }catch(e){ wrongCounts={}; }
  try{ const b=localStorage.getItem(STORAGE_BEST); document.getElementById('best-score').textContent=b?b+'점':'—'; }catch(e){}
  // 오답 누적 수
  const total = Object.values(wrongCounts).reduce((a,b)=>a+b,0);
  document.getElementById('wrong-count-home').textContent = total;
}

function saveWrong(qIdx){
  wrongCounts[qIdx] = (wrongCounts[qIdx]||0) + 1;
  try{ localStorage.setItem(STORAGE_WRONG, JSON.stringify(wrongCounts)); }catch(e){}
}

function saveBest(s){
  try{ const b=parseInt(localStorage.getItem(STORAGE_BEST)||'0'); if(s>b) localStorage.setItem(STORAGE_BEST,s); }catch(e){}
}

function toggleTag(tag,btn){
  if(tag==='all'||tag==='wrong'){
    selectedTags=new Set([tag]);
    document.querySelectorAll('.tag-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  } else {
    selectedTags.delete('all'); selectedTags.delete('wrong');
    document.querySelector('.tag-all').classList.remove('active');
    document.querySelector('.tag-wrong').classList.remove('active');
    if(selectedTags.has(tag)){selectedTags.delete(tag);btn.classList.remove('active');}
    else{selectedTags.add(tag);btn.classList.add('active');}
    if(selectedTags.size===0){selectedTags.add('all');document.querySelector('.tag-all').classList.add('active');}
  }
}

function setN(n,btn){
  TOTAL=n;
  document.querySelectorAll('.n-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function show(id){['screen-home','screen-quiz','screen-result','screen-wrongnote'].forEach(s=>{document.getElementById(s).style.display=s===id?'flex':'none';});}

function startQuiz(){
  let pool;
  if(selectedTags.has('wrong')){
    // 틀린 문제만
    pool = ALL_Q.filter((_,i)=>wrongCounts[i]>0);
    if(pool.length===0){alert('아직 틀린 문제가 없어요! 먼저 퀴즈를 풀어봐요 😊');return;}
    // 인덱스 보존
    pool = ALL_Q.map((q,i)=>({...q,_idx:i})).filter((_,i)=>wrongCounts[i]>0);
  } else if(selectedTags.has('all')){
    pool = ALL_Q.map((q,i)=>({...q,_idx:i}));
  } else {
    pool = ALL_Q.map((q,i)=>({...q,_idx:i})).filter(q=>selectedTags.has(q.tag));
    if(pool.length===0) pool = ALL_Q.map((q,i)=>({...q,_idx:i}));
  }
  questions = shuffle(pool).slice(0, Math.min(TOTAL, pool.length));
  current=0; score=0; answered=false; wrongQ=[];
  show('screen-quiz'); render();
}

function render(){
  if(current>=questions.length){showResult();return;}
  const q=questions[current];
  document.getElementById('hdr-num').textContent=`${current+1}/${questions.length}`;
  document.getElementById('prog').style.width=`${((current+1)/questions.length)*100}%`;
  document.getElementById('hdr-score').textContent=`${score}점`;
  document.getElementById('next-btn').style.display='none';

  const tl=q.type==='mc'?'객관식':q.type==='fill'?'빈칸 채우기':'O / X';
  const tc=q.type==='mc'?'chip-mc':q.type==='fill'?'chip-fill':'chip-ox';
  const parts=q.q.split('\n\n');
  const qtxt=parts[0], code=parts[1]||'';
  const unitName = TAG_NAMES[q.tag]||q.tag;
  const wc = q._idx!==undefined ? (wrongCounts[q._idx]||0) : 0;
  const wcBadge = wc>0 ? `<span class="wrong-count-badge">❌ ${wc}번 틀림</span>` : '';

  let body='';
  if(q.type==='mc'){
    body=`<div class="choices">${q.choices.map((c,i)=>`<button class="choice" onclick="checkMC(${i})" id="ch${i}"><span class="choice-lbl">${['A','B','C','D'][i]}</span>${c}</button>`).join('')}</div>`;
  }else if(q.type==='fill'){
    body=`<div class="fill-wrap"><input class="fill-input" id="fill-in" placeholder="정답 입력..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkFill()"><button class="confirm-btn" onclick="checkFill()">확인</button></div>`;
  }else{
    body=`<div class="ox-row"><button class="ox-btn" onclick="checkOX('O')" id="ox-O"><span>⭕</span><span>O</span></button><button class="ox-btn" onclick="checkOX('X')" id="ox-X"><span>❌</span><span>X</span></button></div>`;
  }

  document.getElementById('quiz-body').innerHTML=`
    <div class="unit-label">${unitName} ${wcBadge}</div>
    <span class="type-chip ${tc}">${tl}</span>
    <div class="q-text">${qtxt}</div>
    ${code?`<div class="q-code">${code}</div>`:''}
    ${body}
    <div class="feedback-box" id="fb"></div>`;
  if(q.type==='fill') setTimeout(()=>{const el=document.getElementById('fill-in');if(el)el.focus();},100);
}

function showFb(correct,q){
  const fb=document.getElementById('fb');
  fb.style.display='block';
  fb.className='feedback-box '+(correct?'correct':'wrong');
  const ans=q.type==='fill'?q.disp:q.type==='mc'?q.choices[q.ans]:q.ans;
  fb.innerHTML=`<div class="fb-title">${correct?'✅ 정답!':'❌ 오답!'}</div>${!correct?`<div class="fb-ans">정답: ${ans}</div>`:''}<div class="fb-exp">${q.exp}</div>`;
  const nb=document.getElementById('next-btn');
  nb.textContent=current+1<questions.length?'다음 문제 →':'결과 보기';
  nb.style.display='block';
}

function checkMC(i){
  if(answered)return; answered=true;
  const q=questions[current];
  [0,1,2,3].forEach(idx=>{const b=document.getElementById('ch'+idx);if(!b)return;b.disabled=true;if(idx===q.ans)b.classList.add('correct');else if(idx===i&&i!==q.ans)b.classList.add('wrong');});
  const ok=i===q.ans;
  if(ok)score++; else{ wrongQ.push(q); if(q._idx!==undefined)saveWrong(q._idx); }
  showFb(ok,q);
}
function checkFill(){
  if(answered)return; answered=true;
  const q=questions[current];
  const val=document.getElementById('fill-in').value.trim();
  const ok=q.ans.map(a=>a.toLowerCase()).includes(val.toLowerCase());
  document.getElementById('fill-in').disabled=true;
  if(ok)score++; else{ wrongQ.push(q); if(q._idx!==undefined)saveWrong(q._idx); }
  showFb(ok,q);
}
function checkOX(v){
  if(answered)return; answered=true;
  const q=questions[current];
  ['O','X'].forEach(ox=>{const b=document.getElementById('ox-'+ox);b.disabled=true;if(ox===q.ans)b.classList.add('correct');else if(ox===v&&v!==q.ans)b.classList.add('wrong');});
  const ok=v===q.ans;
  if(ok)score++; else{ wrongQ.push(q); if(q._idx!==undefined)saveWrong(q._idx); }
  showFb(ok,q);
}
function nextQ(){current++;answered=false;render();}

// ══ 결과 화면 ══
function showResult(){
  saveBest(score); loadData();
  const total=questions.length, pct=Math.round(score/total*100);
  const emoji=pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':'📚';
  const msg=pct===100?'완벽해요! 만점입니다!':pct>=80?'훌륭해요! 거의 다 맞혔네요.':pct>=60?'좋아요! 조금만 더 연습하면 돼요.':'틀린 문제를 꼭 복습해봐요!';
  document.getElementById('res-emoji').textContent=emoji;
  document.getElementById('res-score').innerHTML=`${score}<span class="result-denom">/${total}</span>`;
  document.getElementById('res-pct').textContent=`정답률 ${pct}%`;
  document.getElementById('res-msg').textContent=msg;

  let wrongHTML='';
  if(wrongQ.length>0){
    wrongHTML=`
      <div class="wrong-section-header">
        <span class="wrong-section-title">틀린 문제 (${wrongQ.length}개)</span>
        <button class="select-all-btn" onclick="selectAll()">전체 선택</button>
      </div>
      <div class="wrong-items-list" id="wrong-items-list">
        ${wrongQ.map((q,i)=>{
          const unitName=TAG_NAMES[q.tag]||q.tag;
          const wc=q._idx!==undefined?(wrongCounts[q._idx]||0):0;
          const qtxt=q.q.split('\n\n')[0].slice(0,55)+(q.q.split('\n\n')[0].length>55?'...':'');
          const ans=q.type==='fill'?q.disp:q.type==='mc'?q.choices[q.ans]:q.ans;
          return `<div class="wrong-item-card" id="wcard${i}" onclick="toggleSelect(${i})">
            <div class="wrong-item-check" id="wcheck${i}"></div>
            <div class="wrong-item-content">
              <div class="wrong-item-unit">${unitName}</div>
              <div class="wrong-item-q">${qtxt}</div>
              <div class="wrong-item-cnt">누적 ${wc}번 틀림</div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <button class="copy-selected-btn" id="copy-btn" onclick="copySelected()">📋 선택한 문제 Claude에게 보내기</button>`;
  }
  document.getElementById('wrong-section').innerHTML=wrongHTML;
  window._selectedWrong = new Set();
  show('screen-result');
}

function toggleSelect(i){
  const card=document.getElementById('wcard'+i);
  const check=document.getElementById('wcheck'+i);
  if(window._selectedWrong.has(i)){
    window._selectedWrong.delete(i);
    card.classList.remove('selected');
    check.textContent='';
  } else {
    window._selectedWrong.add(i);
    card.classList.add('selected');
    check.textContent='✓';
  }
  const btn=document.getElementById('copy-btn');
  if(btn) btn.className='copy-selected-btn'+(window._selectedWrong.size>0?' visible':'');
}

function selectAll(){
  wrongQ.forEach((_,i)=>{
    window._selectedWrong.add(i);
    const card=document.getElementById('wcard'+i);
    const check=document.getElementById('wcheck'+i);
    if(card) card.classList.add('selected');
    if(check) check.textContent='✓';
  });
  const btn=document.getElementById('copy-btn');
  if(btn) btn.className='copy-selected-btn visible';
}

function copySelected(){
  const sel=[...window._selectedWrong];
  if(sel.length===0){alert('문제를 선택해주세요!');return;}
  const date=new Date().toLocaleDateString('ko-KR');
  let text=`[Python 퀴즈 오답 기록 - ${date}]\n선택한 문제 ${sel.length}개\n\n`;
  sel.forEach((i,n)=>{
    const q=wrongQ[i];
    const unitName=TAG_NAMES[q.tag]||q.tag;
    const ans=q.type==='fill'?q.disp:q.type==='mc'?q.choices[q.ans]:q.ans;
    const wc=q._idx!==undefined?(wrongCounts[q._idx]||0):0;
    text+=`${n+1}. [${unitName}] ${q.q.split('\n\n')[0]}\n`;
    text+=`   정답: ${ans}\n`;
    text+=`   해설: ${q.exp}\n`;
    text+=`   누적 틀린 횟수: ${wc}번\n\n`;
  });
  text+=`---\nClaude에게: 위 오답 패턴을 분석해서 비슷한 문제를 각 문제당 3~5개씩 만들어 퀴즈 앱에 추가해주세요!`;

  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.getElementById('copy-btn');
    if(btn){btn.textContent='✅ 복사됐어요! Claude에게 붙여넣기 하세요';setTimeout(()=>{btn.textContent='📋 선택한 문제 Claude에게 보내기';},3000);}
  }).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.cssText='position:fixed;top:10%;left:5%;width:90vw;height:70vh;z-index:999;background:#1a1a24;color:#e8e8f0;border:1px solid #7c6ff7;border-radius:12px;padding:1rem;font-size:12px;';
    document.body.appendChild(ta);
    ta.select();
    const close=document.createElement('button');
    close.textContent='전체 선택 후 복사하고 닫기';
    close.style.cssText='position:fixed;top:calc(10% - 44px);left:5%;z-index:1000;padding:10px 16px;background:#7c6ff7;color:#fff;border:none;border-radius:8px;font-size:13px;width:90vw;';
    close.onclick=()=>{ta.select();document.execCommand('copy');document.body.removeChild(ta);document.body.removeChild(close);};
    document.body.appendChild(close);
  });
}

// ══ 오답 노트 ══
function showWrongNote(){
  const body=document.getElementById('note-body');
  const wrongList=ALL_Q.map((q,i)=>({...q,_idx:i,_cnt:wrongCounts[i]||0})).filter(q=>q._cnt>0).sort((a,b)=>b._cnt-a._cnt);
  if(wrongList.length===0){
    body.innerHTML=`<div class="note-empty">아직 틀린 문제가 없어요! 🎉<br>퀴즈를 풀면 여기에 기록돼요.</div>`;
  } else {
    body.innerHTML=wrongList.map(q=>{
      const unitName=TAG_NAMES[q.tag]||q.tag;
      const ans=q.type==='fill'?q.disp:q.type==='mc'?q.choices[q.ans]:q.ans;
      const qtxt=q.q.split('\n\n')[0].slice(0,60)+(q.q.split('\n\n')[0].length>60?'...':'');
      return `<div class="note-item">
        <div class="note-item-top">
          <span class="note-item-unit">${unitName}</span>
          <span class="note-item-cnt">❌ ${q._cnt}번 틀림</span>
        </div>
        <div class="note-item-q">${qtxt}</div>
        <div class="note-item-ans">정답: ${ans}</div>
      </div>`;
    }).join('');
  }
  show('screen-wrongnote');
}

function retryQuiz(){startQuiz();}
function goHome(){show('screen-home');loadData();}

loadData();
show('screen-home');
</script>
