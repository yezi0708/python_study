<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f14">
<title>Python 퀴즈</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f14;--surface:#1a1a24;--surface2:#22222f;--border:#2e2e3e;--accent:#7c6ff7;--accent2:#a89cf7;--green:#4ade80;--green-bg:#0d2b1a;--red:#f87171;--red-bg:#2b0d0d;--amber:#fbbf24;--text:#e8e8f0;--muted:#7070a0;--mono:'DM Mono',monospace;--sans:'Noto Sans KR',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100dvh;overscroll-behavior:none;}

/* ── 홈 ── */
#screen-home{min-height:100dvh;display:flex;flex-direction:column;padding:2.5rem 1.5rem 2rem;}
.home-top{flex:1;display:flex;flex-direction:column;justify-content:center;}
.logo{font-family:var(--mono);font-size:11px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:1.25rem;}
.home-title{font-size:clamp(2rem,8vw,2.8rem);font-weight:700;line-height:1.15;margin-bottom:.5rem;color:var(--accent2);}
.home-sub{font-size:13px;color:var(--muted);line-height:1.6;margin-bottom:1.75rem;}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1.5rem;}
.stat-box{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:.75rem .5rem;text-align:center;}
.stat-num{font-family:var(--mono);font-size:20px;font-weight:500;color:var(--accent2);display:block;margin-bottom:3px;}
.stat-label{font-size:11px;color:var(--muted);}
.section-label{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;}
.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem;}
.tag-btn{padding:5px 12px;font-size:11px;font-family:var(--mono);border:.5px solid var(--border);border-radius:99px;background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s;}
.tag-btn.active{background:rgba(124,111,247,.15);border-color:var(--accent);color:var(--accent2);}
.tag-all.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.tag-wrong.active{background:rgba(248,113,113,.15);border-color:var(--red);color:var(--red);}
.n-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:1.5rem;}
.n-btn{background:var(--surface);border:.5px solid var(--border);border-radius:10px;padding:9px 0;font-size:12px;font-family:var(--mono);color:var(--muted);cursor:pointer;transition:all .15s;}
.n-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
.start-btn{width:100%;padding:1rem;background:var(--accent);border:none;border-radius:14px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;font-family:var(--sans);transition:opacity .15s,transform .1s;}
.start-btn:active{opacity:.85;transform:scale(.98);}

/* ── 퀴즈 ── */
#screen-quiz{display:none;min-height:100dvh;flex-direction:column;}
.quiz-header{padding:1rem 1.25rem .75rem;display:flex;align-items:center;gap:12px;position:sticky;top:0;background:var(--bg);z-index:10;border-bottom:.5px solid var(--border);}
.progress-bg{flex:1;height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;}
.progress-fill{height:100%;background:var(--accent);border-radius:99px;transition:width .4s ease;}
.hdr-score{font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap;}
.hdr-num{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;}
.quiz-body{flex:1;padding:1.25rem 1.25rem 6rem;overflow-y:auto;}
.unit-label{font-size:10px;font-family:var(--mono);color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:.5rem;display:flex;align-items:center;gap:6px;}
.unit-label::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);opacity:.6;}
.wrong-count-badge{font-size:10px;font-family:var(--mono);color:var(--red);background:var(--red-bg);border:.5px solid var(--red);border-radius:99px;padding:2px 7px;margin-left:auto;}
.type-chip{display:inline-flex;align-items:center;font-size:10px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:99px;margin-bottom:1rem;border:.5px solid;}
.chip-mc{color:var(--accent2);border-color:var(--accent);background:rgba(124,111,247,.1);}
.chip-fill{color:#5eead4;border-color:#0d9488;background:rgba(20,184,166,.1);}
.chip-ox{color:var(--amber);border-color:#b45309;background:rgba(251,191,36,.1);}
.chip-mc5{color:#f9a8d4;border-color:#be185d;background:rgba(249,168,212,.1);}
.chip-essay{color:#86efac;border-color:#15803d;background:rgba(134,239,172,.1);}
.choice-mc5{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:.75rem 1rem;font-size:14px;color:var(--text);text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .12s,border-color .12s;font-family:var(--sans);}
.choice-mc5:active:not(:disabled){background:var(--surface2);}
.choice-mc5.selected{background:rgba(124,111,247,.15);border-color:var(--accent);}
.choice-mc5 .choice-lbl{width:26px;height:26px;border-radius:7px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);flex-shrink:0;}
.choice-mc5.correct{background:var(--green-bg);border-color:var(--green);}
.choice-mc5.correct .choice-lbl{background:var(--green);color:#000;}
.choice-mc5.wrong{background:var(--red-bg);border-color:var(--red);}
.choice-mc5.wrong .choice-lbl{background:var(--red);color:#000;}
.mc5-hint{font-size:11px;color:var(--amber);font-family:var(--mono);margin-bottom:.75rem;opacity:.8;}
.essay-input{width:100%;background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:.875rem 1rem;font-size:14px;font-family:var(--sans);color:var(--text);outline:none;transition:border-color .15s;min-height:100px;resize:vertical;line-height:1.65;}
.essay-input:focus{border-color:var(--accent);}
.essay-input:disabled{opacity:.6;}
.q-text{font-size:15px;font-weight:500;line-height:1.65;color:var(--text);margin-bottom:.5rem;white-space:pre-wrap;}
.q-code{background:var(--surface2);border:.5px solid var(--border);border-radius:10px;padding:.875rem 1rem;font-family:var(--mono);font-size:12.5px;color:#c0c0e0;margin:.75rem 0 1.25rem;line-height:1.7;white-space:pre;overflow-x:auto;}
.choices{display:flex;flex-direction:column;gap:10px;margin-top:.25rem;}
.choice{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:.875rem 1rem;font-size:14px;color:var(--text);text-align:left;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .12s,border-color .12s;font-family:var(--sans);}
.choice:active:not(:disabled){background:var(--surface2);}
.choice-lbl{width:26px;height:26px;border-radius:7px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:500;color:var(--muted);flex-shrink:0;}
.choice.correct{background:var(--green-bg);border-color:var(--green);}
.choice.correct .choice-lbl{background:var(--green);color:#000;}
.choice.wrong{background:var(--red-bg);border-color:var(--red);}
.choice.wrong .choice-lbl{background:var(--red);color:#000;}
.choice:disabled{cursor:default;}
.ox-row{display:flex;gap:12px;margin-top:.25rem;}
.ox-btn{flex:1;padding:1.5rem 0;font-size:26px;background:var(--surface);border:.5px solid var(--border);border-radius:16px;cursor:pointer;transition:background .12s;display:flex;flex-direction:column;align-items:center;gap:6px;}
.ox-btn span{font-size:12px;font-family:var(--mono);color:var(--muted);}
.ox-btn:active:not(:disabled){background:var(--surface2);}
.ox-btn.correct{background:var(--green-bg);border-color:var(--green);}
.ox-btn.wrong{background:var(--red-bg);border-color:var(--red);}
.ox-btn:disabled{cursor:default;}
.fill-wrap{margin-top:.25rem;display:flex;flex-direction:column;gap:10px;}
.fill-input{width:100%;background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:.875rem 1rem;font-size:15px;font-family:var(--mono);color:var(--text);outline:none;transition:border-color .15s;}
.fill-input:focus{border-color:var(--accent);}
.fill-input:disabled{opacity:.6;}
.confirm-btn{width:100%;padding:.875rem;background:var(--surface2);border:.5px solid var(--border);border-radius:12px;font-size:15px;font-weight:500;color:var(--text);cursor:pointer;font-family:var(--sans);}
.feedback-box{margin-top:1rem;padding:1rem;border-radius:12px;font-size:13px;line-height:1.7;display:none;border:.5px solid;}
.feedback-box.correct{background:var(--green-bg);border-color:#166534;color:#bbf7d0;}
.feedback-box.wrong{background:var(--red-bg);border-color:#7f1d1d;color:#fecaca;}
.fb-title{font-weight:700;margin-bottom:6px;font-size:14px;}
.fb-ans{margin-bottom:5px;opacity:.85;font-family:var(--mono);}
.fb-exp{opacity:.8;}
.quiz-footer{position:fixed;bottom:0;left:0;right:0;padding:1rem 1.25rem calc(1rem + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 80%,transparent);}
.next-btn{width:100%;padding:1rem;background:var(--accent);border:none;border-radius:14px;font-size:16px;font-weight:700;color:#fff;cursor:pointer;font-family:var(--sans);display:none;transition:opacity .15s,transform .1s;}
.next-btn:active{opacity:.85;transform:scale(.98);}

/* ── 결과 ── */
#screen-result{display:none;min-height:100dvh;flex-direction:column;padding:3rem 1.5rem 2rem;}
.result-emoji{font-size:52px;margin-bottom:1rem;text-align:center;}
.result-score-big{font-family:var(--mono);font-size:clamp(3rem,15vw,5rem);font-weight:500;color:var(--accent2);text-align:center;line-height:1;}
.result-denom{font-size:1.5rem;color:var(--muted);}
.result-pct{text-align:center;font-size:14px;color:var(--muted);font-family:var(--mono);margin:.5rem 0 1rem;}
.result-msg{text-align:center;font-size:15px;color:var(--text);margin-bottom:1.75rem;line-height:1.6;}
.result-btns{display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem;}
.btn-retry{padding:1rem;background:var(--accent);border:none;border-radius:14px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;font-family:var(--sans);}
.btn-home{padding:1rem;background:var(--surface);border:.5px solid var(--border);border-radius:14px;font-size:15px;color:var(--muted);cursor:pointer;font-family:var(--sans);}

/* ── 오답 선택 & 복사 ── */
.concept-summary{background:var(--surface);border:.5px solid var(--border);border-radius:16px;padding:1.25rem;margin-bottom:1.5rem;}
.concept-summary-title{font-size:11px;font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:1rem;}
.concept-weak{margin-bottom:.75rem;}
.concept-weak-header{display:flex;align-items:center;gap:8px;margin-bottom:.4rem;}
.concept-rank{font-family:var(--mono);font-size:11px;color:var(--accent2);background:rgba(124,111,247,.15);border-radius:6px;padding:2px 7px;font-weight:500;}
.concept-name{font-size:14px;font-weight:600;color:var(--text);}
.concept-bar-wrap{height:4px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:.3rem;}
.concept-bar{height:100%;border-radius:99px;background:var(--red);transition:width .6s ease;}
.concept-stat{font-size:11px;font-family:var(--mono);color:var(--muted);}
.concept-ok{font-size:13px;color:var(--green);text-align:center;padding:.75rem 0;}
.wrong-section{border-top:.5px solid var(--border);padding-top:1.5rem;}
.wrong-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
.wrong-section-title{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--mono);}
.select-all-btn{font-size:12px;font-family:var(--mono);color:var(--accent2);background:none;border:none;cursor:pointer;padding:4px 8px;}
.wrong-items-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1rem;}
.wrong-item-card{background:var(--surface);border:.5px solid var(--border);border-radius:10px;padding:.75rem 1rem;display:flex;align-items:flex-start;gap:10px;cursor:pointer;transition:border-color .15s;}
.wrong-item-card.selected{border-color:var(--accent);background:rgba(124,111,247,.08);}
.wrong-item-check{width:20px;height:20px;border-radius:5px;border:.5px solid var(--border);background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;font-size:11px;}
.wrong-item-card.selected .wrong-item-check{background:var(--accent);border-color:var(--accent);color:#fff;}
.wrong-item-content{flex:1;}
.wrong-item-unit{font-size:10px;font-family:var(--mono);color:var(--muted);margin-bottom:3px;}
.wrong-item-q{font-size:13px;color:var(--text);line-height:1.5;}
.wrong-item-cnt{font-size:10px;font-family:var(--mono);color:var(--red);margin-top:3px;}
.copy-selected-btn{width:100%;padding:.875rem;background:rgba(124,111,247,.15);border:.5px solid var(--accent);border-radius:12px;font-size:14px;font-weight:500;color:var(--accent2);cursor:pointer;font-family:var(--sans);transition:background .15s;display:none;}
.copy-selected-btn.visible{display:block;}
.copy-selected-btn:active{background:rgba(124,111,247,.25);}

/* ── 오답 노트 화면 ── */
#screen-wrongnote{display:none;min-height:100dvh;flex-direction:column;}
.note-header{padding:1rem 1.25rem;display:flex;align-items:center;gap:12px;border-bottom:.5px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10;}
.note-back{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:4px;}
.note-title{font-size:15px;font-weight:500;color:var(--text);}
.note-body{flex:1;padding:1.25rem;overflow-y:auto;padding-bottom:4rem;}
.note-empty{text-align:center;color:var(--muted);font-size:14px;margin-top:3rem;line-height:1.8;}
.note-item{background:var(--surface);border:.5px solid var(--border);border-radius:12px;padding:1rem;margin-bottom:10px;}
.note-item-top{display:flex;align-items:center;gap:8px;margin-bottom:.5rem;}
.note-item-unit{font-size:10px;font-family:var(--mono);color:var(--muted);}
.note-item-cnt{font-size:11px;font-family:var(--mono);color:var(--red);background:var(--red-bg);border:.5px solid var(--red);border-radius:99px;padding:2px 8px;margin-left:auto;}
.note-item-q{font-size:13px;color:var(--text);line-height:1.5;margin-bottom:.5rem;}
.note-item-ans{font-size:12px;font-family:var(--mono);color:var(--green);opacity:.8;}
</style>
</head>
<body>

<!-- ── 홈 ── -->
<div id="screen-home">
  <div class="home-top">
    <div class="logo">🐍 Python Quiz</div>
    <h1 class="home-title">Python<br>기초 문법</h1>
    <p class="home-sub">객관식 · 빈칸 · OX · 5지선다 · 서술형<br>총 836문제 랜덤 출제</p>
    <div class="stat-row">
      <div class="stat-box"><span class="stat-num">836</span><span class="stat-label">총 문제</span></div>
      <div class="stat-box"><span class="stat-num" id="wrong-count-home">0</span><span class="stat-label">오답 누적</span></div>
      <div class="stat-box"><span class="stat-num" id="best-score">—</span><span class="stat-label">최고점수</span></div>
    </div>

    <div class="section-label">모드</div>
    <div class="tag-row" id="tag-row">
      <button class="tag-btn tag-all active" onclick="toggleTag('all',this)">전체</button>
      <button class="tag-btn tag-wrong" onclick="toggleTag('wrong',this)">❌ 오답만</button>
      <button class="tag-btn" onclick="toggleTag('flowchart',this)">순서도</button>
      <button class="tag-btn" onclick="toggleTag('dtype',this)">자료형</button>
      <button class="tag-btn" onclick="toggleTag('func',this)">함수</button>
      <button class="tag-btn" onclick="toggleTag('dict',this)">딕셔너리</button>
      <button class="tag-btn" onclick="toggleTag('string',this)">문자열</button>
      <button class="tag-btn" onclick="toggleTag('list',this)">리스트</button>
      <button class="tag-btn" onclick="toggleTag('loop',this)">반복문</button>
      <button class="tag-btn" onclick="toggleTag('basic',this)">기초문법</button>
      <button class="tag-btn" onclick="toggleTag('file',this)">파일/기타</button>
      <button class="tag-btn" onclick="toggleTag('hangman',this)">행맨</button>
    </div>

    <div class="section-label">문제 수</div>
    <div class="n-row">
      <button class="n-btn" onclick="setN(10,this)">10</button>
      <button class="n-btn active" onclick="setN(20,this)">20</button>
      <button class="n-btn" onclick="setN(50,this)">50</button>
      <button class="n-btn" onclick="setN(100,this)">100</button>
      <button class="n-btn" onclick="setN(9999,this)">전부</button>
    </div>

    <button class="tag-btn" style="margin-bottom:1rem;width:100%;text-align:center;padding:10px;" onclick="showWrongNote()">📒 오답 노트 보기</button>
  </div>
  <button class="start-btn" onclick="startQuiz()">시작하기</button>
</div>

<!-- ── 퀴즈 ── -->
<div id="screen-quiz">
  <div class="quiz-header">
    <span class="hdr-num" id="hdr-num">1/20</span>
    <div class="progress-bg"><div class="progress-fill" id="prog" style="width:5%"></div></div>
    <span class="hdr-score" id="hdr-score">0점</span>
  </div>
  <div class="quiz-body" id="quiz-body"></div>
  <div class="quiz-footer">
    <button class="next-btn" id="next-btn" onclick="nextQ()">다음 문제 →</button>
  </div>
</div>

<!-- ── 결과 ── -->
<div id="screen-result">
  <div class="result-emoji" id="res-emoji">🏆</div>
  <div class="result-score-big" id="res-score">0<span class="result-denom">/20</span></div>
  <div class="result-pct" id="res-pct">정답률 0%</div>
  <div class="result-msg" id="res-msg"></div>
  <div class="result-btns">
    <button class="btn-retry" onclick="retryQuiz()">같은 설정으로 다시 풀기</button>
    <button class="btn-home" onclick="goHome()">홈으로</button>
  </div>
  <div id="concept-summary-section"></div>
  <div class="wrong-section" id="wrong-section"></div>
</div>

<!-- ── 오답 노트 ── -->
<div id="screen-wrongnote">
  <div class="note-header">
    <button class="note-back" onclick="show('screen-home')">←</button>
    <span class="note-title">📒 오답 노트</span>
  </div>
  <div class="note-body" id="note-body"></div>
</div>

<script>
// ══ 태그 한글명 ══
const TAG_NAMES = {
  string:'문자열', list:'리스트', loop:'반복문',
  basic:'기초문법', file:'파일/기타', hangman:'행맨',
  func:'함수', dict:'딕셔너리', flowchart:'순서도·자료형', dtype:'자료형'
};

const ALL_Q = [
  // ── 기초문법 ────────────────────────────────────────────────
  {type:"mc",tag:"basic",q:"다음 중 정수형(int)을 올바르게 선언한 것은?",choices:["a = '3'","a = 3.0","a = 3","a = True"],ans:2,exp:"따옴표 없이 정수를 쓰면 int 타입이에요. 3.0은 float, True는 bool입니다."},
  {type:"mc",tag:"basic",q:"함수를 정의할 때 사용하는 키워드는?",choices:["func","define","def","function"],ans:2,exp:"Python에서는 def 키워드로 함수를 정의해요."},
  {type:"mc",tag:"basic",q:"다음 중 불변(immutable) 자료형은?",choices:["list","dict","set","tuple"],ans:3,exp:"tuple은 한 번 만들면 변경할 수 없는 불변 자료형이에요."},
  {type:"mc",tag:"basic",q:"변수의 타입을 확인하는 함수는?",choices:["typeof()","type()","isinstance()","class()"],ans:1,exp:"type(변수)로 타입을 확인해요."},

  {type:"mc",tag:"basic",q:"try-except-finally에서 finally 블록은?",choices:["오류가 없을 때만 실행","오류가 있을 때만 실행","항상 실행","선택적으로 실행"],ans:2,exp:"finally는 오류 유무와 관계없이 항상 실행돼요. 파일 닫기 등에 써요."},
  {type:"mc",tag:"basic",q:"except Exception as e: 에서 e는?",choices:["예외 타입 이름","예외 객체(오류 메시지 등 포함)","에러 코드","None"],ans:1,exp:"as e로 예외 객체를 받아 print(e)로 오류 메시지를 볼 수 있어요."},
  {type:"ox",tag:"basic",q:"하나의 try 블록에 여러 except를 쓸 수 있다.",ans:"O",exp:"except ValueError: ... except KeyError: ... 처럼 여러 예외를 따로 처리할 수 있어요."},
  {type:"ox",tag:"basic",q:"try 블록 안에서 오류가 발생하면 그 줄 아래 코드는 실행되지 않는다.",ans:"O",exp:"오류 발생 시 즉시 except로 점프해요. try 안의 나머지 코드는 건너뛰어요."},
  {type:"mc",tag:"basic",q:"try:\n    a = [1,2,3]\n    print(a[5])\nexcept IndexError:\n    print('범위 오류')\nprint('끝')의 출력은?",choices:["범위 오류\n끝","끝","범위 오류","오류 발생 후 중단"],ans:0,exp:"IndexError를 잡아 '범위 오류'를 출력하고 프로그램이 계속 실행돼 '끝'도 출력돼요."},
  {type:"fill",tag:"basic",q:"파일을 열 때 파일이 없으면 처리:\n\ntry:\n    f = open('없는파일.txt')\nexcept _____________:\n    print('파일 없음')",ans:["FileNotFoundError"],disp:"FileNotFoundError",exp:"존재하지 않는 파일을 열면 FileNotFoundError가 발생해요."},
  {type:"mc",tag:"basic",q:"try-except에서 else 블록의 역할은?",choices:["항상 실행","오류가 있을 때만 실행","오류가 없을 때만 실행","except 대신 사용"],ans:2,exp:"else는 try 블록이 오류 없이 성공했을 때만 실행돼요."},
  {type:"mc",tag:"basic",q:"raise ValueError('잘못된 값') 의 역할은?",choices:["예외를 잡음","예외를 직접 발생시킴","예외를 무시함","프로그램을 종료"],ans:1,exp:"raise로 예외를 직접 발생시킬 수 있어요. 유효성 검사 등에 써요."},
  // ── 예외 처리 (중) ──────────────────────────────────────────
  {type:"mc",tag:"basic",q:"다음 코드의 출력은?\n\ntry:\n    print(1/0)\nexcept ZeroDivisionError:\n    print('0으로 나눔')\nfinally:\n    print('종료')",choices:["0으로 나눔","0으로 나눔\n종료","종료","1/0"],ans:1,exp:"ZeroDivisionError를 잡아 '0으로 나눔' 출력 후, finally로 '종료'도 출력돼요."},
  {type:"mc",tag:"basic",q:"except (ValueError, TypeError): 의 의미는?",choices:["ValueError만 잡음","TypeError만 잡음","둘 중 하나를 잡음","둘 다 따로 처리"],ans:2,exp:"튜플로 묶으면 여러 예외를 하나의 except에서 처리할 수 있어요."},
  {type:"mc",tag:"basic",q:"다음 코드의 출력은?\n\ntry:\n    x = int('5')\nexcept ValueError:\n    print('오류')\nelse:\n    print('성공')\nprint('끝')",choices:["오류\n끝","성공\n끝","끝","성공"],ans:1,exp:"'5'는 int로 변환 가능해서 오류가 없어요. else 블록이 실행돼요."},
  {type:"mc",tag:"basic",q:"예외 메시지를 출력하려면?",choices:["print(except)","except ValueError as e: print(e)","print(error)","except.message"],ans:1,exp:"as e로 예외 객체를 받아 print(e)로 메시지를 출력할 수 있어요."},
  {type:"ox",tag:"basic",q:"finally는 return이 실행되어도 항상 실행된다.",ans:"O",exp:"finally는 return, break, continue가 있어도 반드시 실행돼요."},
  {type:"mc",tag:"basic",q:"사용자 정의 예외 클래스를 만들려면?",choices:["class MyError:","class MyError(Exception):","def MyError():","raise MyError"],ans:1,exp:"Exception을 상속해서 커스텀 예외를 만들어요."},
  {type:"fill",tag:"basic",q:"예외를 잡아서 오류 메시지 출력:\n\ntry:\n    int('abc')\nexcept ValueError ___ e:\n    print(e)",ans:["as"],disp:"as",exp:"as 키워드로 예외 객체를 변수에 담아요."},
  {type:"mc",tag:"basic",q:"try 블록에서 오류가 없으면 except는 건너뛰고 어디로 가나?",choices:["finally(있으면) → 다음 코드","except로 이동","프로그램 종료","None 반환"],ans:0,exp:"오류가 없으면 except를 건너뛰고 finally(있으면) 실행 후 계속해요."},
  {type:"ox",tag:"basic",q:"except 없이 try-finally만 쓸 수 있다.",ans:"O",exp:"try-finally만으로도 유효해요. 예외를 잡지 않고 finally만 보장할 때 써요."},
  {type:"mc",tag:"basic",q:"다음 코드에서 출력되는 것은?\n\ndef safe_div(a, b):\n    try:\n        return a / b\n    except ZeroDivisionError:\n        return None\n\nprint(safe_div(10, 0))",choices:["0","10","None","오류"],ans:2,exp:"0으로 나누면 ZeroDivisionError를 잡아 None을 반환해요."},
  // ── 예외 처리 (상) ──────────────────────────────────────────
  {type:"mc",tag:"basic",q:"다음 코드의 출력은?\n\ntry:\n    raise ValueError('테스트')\nexcept ValueError as e:\n    print(str(e))",choices:["ValueError","테스트","오류","None"],ans:1,exp:"raise로 발생시킨 예외의 메시지 '테스트'가 출력돼요."},
  {type:"mc",tag:"basic",q:"except Exception: 과 except: 의 차이는?",choices:["같음","except Exception은 SystemExit 등을 못 잡음","except는 모든 예외, except Exception은 일부만","except가 더 좁은 범위"],ans:1,exp:"except Exception은 KeyboardInterrupt, SystemExit 등을 못 잡아요. except:는 모든 것을 잡아요."},
  {type:"mc",tag:"basic",q:"다음 코드의 출력은?\n\ntry:\n    try:\n        raise ValueError\n    except TypeError:\n        print('TypeError')\nexcept ValueError:\n    print('ValueError')",choices:["TypeError","ValueError","TypeError\nValueError","오류"],ans:1,exp:"안쪽 except TypeError는 ValueError를 못 잡아요. 바깥 except ValueError가 잡아요."},
  {type:"mc",tag:"basic",q:"context manager(with문)와 try-finally의 공통점은?",choices:["같은 문법","종료 시 정리 코드를 보장","예외를 잡음","둘 다 오류 발생"],ans:1,exp:"with문은 내부적으로 try-finally와 비슷하게 __exit__을 보장해요."},
  {type:"ox",tag:"basic",q:"except 절에서 다시 raise를 쓰면 같은 예외를 다시 발생시킨다.",ans:"O",exp:"except 안에서 raise만 쓰면 현재 잡은 예외를 다시 발생시켜요."},
  {type:"fill",tag:"basic",q:"어떤 예외든 잡아서 로그 출력 후 재발생:\n\ntry:\n    risky()\nexcept Exception as e:\n    print('로그:', e)\n    _____",ans:["raise"],disp:"raise",exp:"raise만 쓰면 현재 예외를 다시 발생시켜요."},
  {type:"mc",tag:"basic",q:"AssertionError는 언제 발생하나?",choices:["ZeroDivision 시","assert 조건이 False일 때","import 실패 시","타입 불일치 시"],ans:1,exp:"assert x > 0 에서 x <= 0이면 AssertionError가 발생해요."},
  {type:"mc",tag:"basic",q:"try-except의 성능에 대한 설명으로 옳은 것은?",choices:["항상 느림","오류가 없으면 거의 오버헤드 없음","if보다 빠름","오류가 많을수록 빠름"],ans:1,exp:"예외가 발생하지 않으면 try-except의 오버헤드는 매우 작아요."},
  {type:"mc",tag:"basic",q:"NameError는 언제 발생하나?",choices:["타입 오류","정의되지 않은 변수 사용","키 오류","인덱스 오류"],ans:1,exp:"print(x)에서 x가 정의되지 않으면 NameError: name 'x' is not defined가 발생해요."},
  {type:"ox",tag:"basic",q:"try 블록 안에서 return이 실행되면 finally도 실행된다.",ans:"O",exp:"finally는 return, break, continue에도 반드시 실행되는 블록이에요."},

  // ── sort(reverse=) / 정렬 ────────────────────────────────────
  {type:"mc",tag:"list",q:"my_list.sort(reverse=True)의 결과는?",choices:["오름차순 정렬","내림차순 정렬","역순 출력","오류"],ans:1,exp:"reverse=True는 내림차순 정렬이에요."},
  {type:"mc",tag:"list",q:"my_list.sort(reverse=False)는?",choices:["내림차순","오름차순 (기본값과 같음)","변화 없음","오류"],ans:1,exp:"reverse=False는 기본값으로 오름차순이에요."},
  {type:"mc",tag:"list",q:"a = [3,1,4,1,5]일 때 a.sort(reverse=True) 후 a는?",choices:["[1,1,3,4,5]","[5,4,3,1,1]","[3,1,4,1,5]","오류"],ans:1,exp:"내림차순이므로 큰 수부터 [5,4,3,1,1]이에요."},
  {type:"fill",tag:"list",q:"리스트 내림차순 정렬:\n\nmy_list.sort(reverse=____)",ans:["True"],disp:"True",exp:"reverse=True로 내림차순 정렬해요."},
  {type:"ox",tag:"list",q:"sorted(a, reverse=True)는 원본 a를 변경한다.",ans:"X",exp:"sorted()는 새 리스트를 반환해요. 원본은 그대로예요."},
  {type:"mc",tag:"list",q:"a = ['banana','apple','cherry']일 때 sorted(a, reverse=True)는?",choices:["['apple','banana','cherry']","['cherry','banana','apple']","['banana','apple','cherry']","오류"],ans:1,exp:"알파벳 역순이므로 c > b > a 순으로 정렬돼요."},
  {type:"mc",tag:"list",q:"a = [3,1,2]일 때 b = sorted(a, reverse=True) 후 a는?",choices:["[3,2,1]","[1,2,3]","[3,1,2]","오류"],ans:2,exp:"sorted()는 원본을 변경하지 않아요. a는 [3,1,2] 그대로예요."},
  {type:"fill",tag:"list",q:"내림차순으로 정렬된 새 리스트 만들기:\n\na = [3,1,2]\nb = _______(a, reverse=True)",ans:["sorted"],disp:"sorted",exp:"sorted()는 새 리스트를 반환하고 원본은 그대로예요."},
  {type:"mc",tag:"list",q:"sort()와 sorted()에서 reverse=True는 어디서 사용 가능?",choices:["sort()만","sorted()만","둘 다","둘 다 불가"],ans:2,exp:"a.sort(reverse=True)와 sorted(a, reverse=True) 모두 가능해요."},
  {type:"ox",tag:"list",q:"reverse=True는 정렬 기준을 바꾸는 게 아니라 정렬 방향만 바꾼다.",ans:"O",exp:"정렬 기준은 key 매개변수로, 방향은 reverse로 따로 조절해요."},

  {type:"mc",tag:"dict",q:"d = {'a':1,'b':2}일 때 for k in d: print(k)의 출력은?",choices:["1\n2","a\nb","('a',1)\n('b',2)","오류"],ans:1,exp:"for k in d는 기본적으로 키를 순회해요."},

  {type:"mc",tag:"dict",q:"d = {'x':10,'y':20}일 때 for k in d: print(d[k])의 출력은?",choices:["x\ny","10\n20","('x',10)\n('y',20)","오류"],ans:1,exp:"k는 키('x','y')이고 d[k]로 값을 꺼내면 10, 20이 출력돼요."},

  {type:"ox",tag:"dict",q:"for k in d: 로 순회하면 키와 값이 동시에 나온다.",ans:"X",exp:"키만 나와요. 값도 함께 원하면 d.items()를 써야 해요."},
  {type:"fill",tag:"dict",q:"딕셔너리 키-값 쌍 순회:\n\nfor k, v in d.______():\n    print(k, v)",ans:["items"],disp:"items",exp:"d.items()는 (키, 값) 쌍을 반환해요."},
  {type:"mc",tag:"dict",q:"d = {'a':1,'b':2,'c':3}일 때 sum(d.values())는?",choices:["3","6","'abc'","오류"],ans:1,exp:"d.values()=[1,2,3]이고 sum([1,2,3])=6이에요."},
  {type:"mc",tag:"dict",q:"for k, v in d.items(): 에서 k와 v는 각각?",choices:["k=값, v=키","k=키, v=값","k=인덱스, v=키","k=튜플, v=없음"],ans:1,exp:"items()는 (키, 값) 순서로 반환해요."},
  {type:"fill",tag:"dict",q:"딕셔너리 값만 리스트로 변환:\n\nvals = list(d.______())",ans:["values"],disp:"values",exp:"d.values()로 값 목록을 얻고 list()로 변환해요."},

  // ── is None / is not None ────────────────────────────────────
  {type:"mc",tag:"basic",q:"x = None일 때 x is None의 결과는?",choices:["True","False","None","오류"],ans:0,exp:"None은 is로 비교해요. x = None이므로 True예요."},
  {type:"mc",tag:"basic",q:"x = None일 때 x is not None의 결과는?",choices:["True","False","None","오류"],ans:1,exp:"x가 None이므로 is not None은 False예요. 둘은 서로 반대예요."},
  {type:"mc",tag:"basic",q:"if x is None: 과 if x is not None: 의 관계는?",choices:["같음","정반대 조건","is None이 더 넓음","is not None이 더 좁음"],ans:1,exp:"is None은 None일 때 True, is not None은 None이 아닐 때 True예요."},
  {type:"mc",tag:"basic",q:"x = 0일 때 x is None의 결과는?",choices:["True","False","0","오류"],ans:1,exp:"0은 None이 아니에요. 0은 falsy지만 None과는 달라요."},
  {type:"mc",tag:"basic",q:"x = ''일 때 x is not None의 결과는?",choices:["True","False","''","오류"],ans:0,exp:"빈 문자열은 None이 아니에요. is not None → True예요."},
  {type:"ox",tag:"basic",q:"if x is None: 과 if not x: 는 항상 같은 결과를 낸다.",ans:"X",exp:"not x는 0, '', [], False도 True가 돼요. is None은 오직 None만 True예요."},
  {type:"ox",tag:"basic",q:"x is not None은 x != None과 항상 같다.",ans:"X",exp:"대부분 같지만 커스텀 클래스에서 __eq__를 오버라이드하면 다를 수 있어요. is not None이 더 안전해요."},
  {type:"fill",tag:"basic",q:"None이 아닐 때만 처리하는 코드:\n\nif result ___ ___ None:\n    print(result)",ans:["is not"],disp:"is not",exp:"is not None으로 None이 아닌 경우를 확인해요."},
  {type:"mc",tag:"basic",q:"다음 중 is None이 True인 것은?",choices:["x = 0","x = False","x = ''","x = None"],ans:3,exp:"오직 None만 is None이 True예요. 0, False, ''은 모두 False예요."},
  {type:"mc",tag:"basic",q:"def f(): pass 일 때 f() is None의 결과는?",choices:["True","False","pass","오류"],ans:0,exp:"pass만 있는 함수는 None을 반환해요. f() is None → True예요."},
  {type:"mc",tag:"basic",q:"x = [] 일 때 x is None의 결과는?",choices:["True","False","[]","오류"],ans:1,exp:"빈 리스트는 None이 아니에요. is None → False예요."},
  {type:"ox",tag:"basic",q:"None은 파이썬에 단 하나만 존재하는 싱글턴 객체다.",ans:"O",exp:"None은 NoneType의 유일한 인스턴스예요. 그래서 ==보다 is로 비교하는 게 정확해요."},
  {type:"fill",tag:"basic",q:"함수 반환값이 None인지 확인:\n\nresult = some_func()\nif result ___ None:\n    print('값 없음')",ans:["is"],disp:"is",exp:"None 비교는 is를 사용하는 게 파이썬 권장 방식이에요."},
  {type:"mc",tag:"basic",q:"x = None, y = None일 때 x is y의 결과는?",choices:["True","False","None","오류"],ans:0,exp:"None은 싱글턴이라 모든 None은 같은 객체예요. x is y → True예요."},
  {type:"mc",tag:"basic",q:"다음 중 None 비교의 권장 방식은?",choices:["x == None","x != None","x is None","x = None"],ans:2,exp:"PEP8은 None 비교에 is/is not을 권장해요."},

  {type:"mc5",tag:"string",q:"다음 중 문자열의 불변성(immutable)에 관한 올바른 설명은?",choices:["s[0] = 'H'는 TypeError를 발생시킨다","s.upper()는 s 자체를 변경한다","s.replace('a','b')는 새 문자열을 반환한다","s = s.upper()처럼 재할당해야 변경된 결과를 저장할 수 있다","s.append('!')로 문자를 추가할 수 있다"],ans:[0,2,3],exp:"문자열은 불변이에요. 메서드는 새 문자열을 반환하고 원본은 그대로예요."},

  // ── 서술형 10문제 (각 개념별 2개씩) ─────────────────────
  {type:"essay",tag:"dict",q:"딕셔너리에서 'key in d'가 True를 반환하는 조건을 설명하고, 값(value)을 검색하려면 어떻게 해야 하는지 코드와 함께 서술하세요.",ans:"'key in d'는 키(key)가 딕셔너리에 존재할 때 True를 반환합니다. 값 검색은 'value in d.values()'를 사용해야 합니다.",exp:"in 연산자는 기본적으로 키만 검색해요. 값 검색: value in d.values()"},
  {type:"essay",tag:"dict",q:"d.get(key)와 d[key]의 차이를 설명하고, 각각 어떤 상황에서 사용하는 게 적합한지 서술하세요.",ans:"d[key]는 키가 없으면 KeyError를 발생시키고, d.get(key)는 키가 없으면 None(또는 기본값)을 반환합니다. 키 존재가 확실하면 d[key], 불확실하면 d.get()을 사용합니다.",exp:"d.get(key, 기본값)은 안전한 접근 방법이에요."},
  {type:"essay",tag:"loop",q:"중첩 for문에서 break를 사용할 때 주의해야 할 점을 설명하고, 모든 루프를 종료하려면 어떻게 해야 하는지 서술하세요.",ans:"break는 자신이 속한 가장 안쪽 루프만 종료합니다. 모든 루프를 종료하려면 플래그 변수(found = True)를 사용하거나, 함수로 감싸서 return을 사용하는 방법이 있습니다.",exp:"break는 가장 가까운 루프 하나만 종료해요."},
  {type:"essay",tag:"loop",q:"continue와 break의 차이를 설명하고, 각각의 사용 예시 코드를 한 줄씩 작성하세요.",ans:"continue는 현재 반복의 나머지 코드를 건너뛰고 다음 반복으로 넘어갑니다. break는 루프 전체를 즉시 종료합니다. continue 예: 짝수 건너뛰기. break 예: 특정 값을 찾으면 종료.",exp:"continue: 현재 반복 건너뜀. break: 루프 전체 종료."},
  {type:"essay",tag:"string",q:"파이썬 문자열이 불변(immutable)이라는 것의 의미를 설명하고, 문자열을 '수정'하는 올바른 방법을 코드로 보여주세요.",ans:"문자열 불변이란 한 번 생성된 문자열은 내부 값을 직접 변경할 수 없다는 의미입니다. s[0]='H'처럼 인덱스로 수정할 수 없어요. 올바른 방법: s = 'H' + s[1:] 또는 s = s.replace('h','H')처럼 새 문자열을 만들어 재할당해야 합니다.",exp:"문자열은 불변. 메서드로 새 문자열을 만들어 재할당해요."},
  {type:"essay",tag:"string",q:"str.replace()를 사용할 때 흔히 하는 실수와 올바른 사용법을 코드로 설명하세요.",ans:"흔한 실수: s.replace('a','b') 처럼 결과를 변수에 저장하지 않는 것입니다. replace()는 원본을 수정하지 않고 새 문자열을 반환하므로, s = s.replace('a','b') 처럼 반드시 반환값을 저장해야 합니다.",exp:"replace() 결과를 변수에 저장해야 해요."},
  {type:"essay",tag:"func",q:"파이썬 함수에서 return이 없을 때 어떤 일이 발생하는지 설명하고, 이로 인해 발생할 수 있는 버그 사례를 한 가지 제시하세요.",ans:"return이 없는 함수는 None을 반환합니다. 버그 사례: result = a.sort()를 하면 a는 정렬되지만 result = None이 되어 result를 이용한 후속 코드에서 오류가 발생할 수 있습니다.",exp:"return 없는 함수 → None 반환. sort(), append() 주의!"},
  {type:"essay",tag:"func",q:"매개변수(parameter)와 인수(argument)의 차이를 예시 코드와 함께 설명하세요.",ans:"매개변수는 함수를 정의할 때 괄호 안에 쓰는 변수입니다(def add(a, b)에서 a, b). 인수는 함수를 호출할 때 실제로 전달하는 값입니다(add(3, 5)에서 3, 5). 매개변수는 함수 안에서만 존재하는 지역변수입니다.",exp:"정의 시: 매개변수(parameter). 호출 시: 인수(argument)."},
  {type:"essay",tag:"basic",q:"파이썬에서 None을 비교할 때 ==이 아닌 is를 권장하는 이유를 설명하세요.",ans:"None은 파이썬에 단 하나만 존재하는 싱글턴 객체입니다. is는 동일한 객체인지 확인하는 연산자로, None 비교에 정확합니다. == 는 값 동등성을 비교하며 커스텀 클래스에서 __eq__를 오버라이드하면 다른 결과가 나올 수 있습니다. PEP8도 is/is not 사용을 권장합니다.",exp:"None은 싱글턴. is는 동일 객체 비교. is가 더 안전하고 명확해요."},
  {type:"essay",tag:"basic",q:"if not x: 와 if x is None: 의 차이를 설명하고, 각각 어떤 상황에서 써야 하는지 서술하세요.",ans:"if not x:는 x가 None, 0, False, '', [], {} 등 falsy한 값일 때 모두 True가 됩니다. if x is None:은 오직 x가 None일 때만 True가 됩니다. 값이 정확히 None인지 확인해야 할 때는 is None을, falsy한 값 전체를 처리해야 할 때는 not x를 씁니다.",exp:"not x: 0, False, [] 등 falsy 모두 해당. is None: 오직 None만."},

  // ── random.choice() 서술형 10개 ──
  {type:"essay",tag:"hangman",q:"random.choice()와 random.randint()의 차이를 설명하고 각각의 사용 사례를 예시로 드세요.",ans:"choice(seq)는 시퀀스에서 원소 하나를 무작위 선택해요. randint(a,b)는 a~b 사이 정수 하나를 반환해요. choice(): 단어 목록에서 랜덤 선택, 메뉴 뽑기. randint(): 주사위(1~6), 랜덤 인덱스.",exp:"choice(): 시퀀스에서 원소 선택. randint(): 범위 내 정수 생성."},
  {type:"essay",tag:"hangman",q:"딕셔너리의 키 중 하나를 랜덤으로 선택하는 코드를 작성하세요.",ans:"import random\nd = {'가위':1, '바위':2, '보':3}\nkey = random.choice(list(d.keys()))\nprint(key)\n딕셔너리는 시퀀스가 아니라 list(d.keys())로 변환 후 사용해요.",exp:"dict.keys()를 list()로 변환 후 choice()."},
  {type:"essay",tag:"hangman",q:"random.choice()로 가위바위보 게임 컴퓨터 선택 부분을 구현하세요.",ans:"import random\nchoices = ['가위', '바위', '보']\ncomputer = random.choice(choices)\nprint(f'컴퓨터: {computer}')",exp:"choices 리스트 + random.choice()로 컴퓨터 선택 구현."},
  {type:"essay",tag:"hangman",q:"random.choice()가 set에서 동작하지 않는 이유와 해결 방법을 설명하세요.",ans:"set은 인덱스가 없는 순서 없는 자료구조라 choice()가 내부적으로 사용하는 인덱스 접근이 불가해요. 해결: random.choice(list(my_set)) 또는 random.sample(my_set, 1)[0].",exp:"set은 인덱스 없음 → list() 변환 후 choice()."},
  {type:"essay",tag:"hangman",q:"random.choice()와 random.sample()의 차이를 설명하세요.",ans:"choice()는 시퀀스에서 1개를 선택해요. sample(seq, k)는 중복 없이 k개를 선택해 리스트로 반환해요. 1개만 필요하면 choice()가 더 간단하고, 여러 개 중복 없이 뽑으려면 sample()을 써요.",exp:"choice(): 1개. sample(seq,k): 중복 없이 k개."},
  {type:"essay",tag:"hangman",q:"random.seed()를 고정하면 choice()의 결과가 어떻게 달라지는지 설명하세요.",ans:"random.seed(42)를 설정하면 이후 random 함수들의 결과가 항상 같아요. 재현 가능한 테스트나 디버깅 시 유용해요. 시드를 설정하지 않으면 현재 시간을 시드로 사용해 매번 다른 결과가 나와요.",exp:"seed() 고정 → 결과 재현 가능. 테스트/디버깅에 유용."},
  {type:"essay",tag:"hangman",q:"행맨 게임에서 random.choice()를 사용해 단어를 선택하는 코드를 작성하세요.",ans:"import random\nwords = ['apple', 'banana', 'python', 'computer']\nanswer = random.choice(words)\nprint(f'글자 수: {len(answer)}')\nresult = ['_'] * len(answer)\nprint(result)",exp:"random.choice(words)로 단어 선택. ['_']*len()으로 빈칸 생성."},
  {type:"essay",tag:"hangman",q:"random.choices()와 random.choice()의 차이를 설명하고, 가중치(weights) 옵션 활용 예시를 작성하세요.",ans:"choice()는 1개 선택. choices()는 k개를 중복 허용으로 선택해요. 가중치 예:\nrandom.choices(['꽝','소','중','대'], weights=[70,20,8,2], k=1)[0]\n70% 꽝, 20% 소상품, 8% 중상품, 2% 대상품.",exp:"choices()는 중복 허용 복수 선택. weights로 확률 조절."},
  {type:"essay",tag:"hangman",q:"리스트에서 원소를 선택하고 제거하는 패턴을 random.choice()를 활용해 작성하세요.",ans:"import random\nitems = ['apple', 'banana', 'cherry']\nselected = random.choice(items)\nitems.remove(selected)\nprint(selected, items)\n또는 randint()+pop():\nidx = random.randint(0, len(items)-1)\nselected = items.pop(idx)",exp:"choice()로 선택 후 remove(). 또는 randint()+pop()."},
  {type:"essay",tag:"hangman",q:"random 모듈에서 자주 사용되는 5가지 함수를 정리하고 간단한 예시를 작성하세요.",ans:"1. random.random(): 0~1 실수. if random.random() < 0.5: print('앞')\n2. random.randint(a,b): a~b 정수. random.randint(1,6)\n3. random.choice(lst): 원소 1개. random.choice(['가','나','다'])\n4. random.shuffle(lst): in-place 섞기. random.shuffle(deck)\n5. random.sample(lst,k): 중복 없이 k개. random.sample(range(1,46),6)",exp:"5대 함수: random(), randint(), choice(), shuffle(), sample()."},

  {type:"ox",tag:"hangman",q:"random.randint(3, 1)은 자동으로 1~3 사이 값을 반환한다.",ans:"X",exp:"시작값이 끝값보다 크면 ValueError가 발생해요."},

  {type:"ox",tag:"hangman",q:"random.randint(1,10)을 10번 호출하면 1~10이 각각 반드시 한 번씩 나온다.",ans:"X",exp:"무작위이므로 같은 값이 여러 번 나올 수 있어요."},

// ══ localStorage 키 ══
const STORAGE_WRONG = 'pq_wrong_counts'; // {qIndex: count}
const STORAGE_BEST  = 'pq_best';

let TOTAL=20, selectedTags=new Set(['all']), questions=[], current=0, score=0, answered=false, wrongQ=[];
let wrongCounts = {};

function loadData(){
  try{ wrongCounts = JSON.parse(localStorage.getItem(STORAGE_WRONG)||'{}'); }catch(e){ wrongCounts={}; }
  try{ const b=localStorage.getItem(STORAGE_BEST); document.getElementById('best-score').textContent=b?b+'점':'—'; }catch(e){}
  // 오답 누적 수
  const total = Object.values(wrongCounts).reduce((a,b)=>a+b,0);
  document.getElementById('wrong-count-home').textContent = total;
}

function saveWrong(qIdx){
  wrongCounts[qIdx] = (wrongCounts[qIdx]||0) + 1;
  try{ localStorage.setItem(STORAGE_WRONG, JSON.stringify(wrongCounts)); }catch(e){}
}

function saveBest(s){
  try{ const b=parseInt(localStorage.getItem(STORAGE_BEST)||'0'); if(s>b) localStorage.setItem(STORAGE_BEST,s); }catch(e){}
}

function toggleTag(tag,btn){
  if(tag==='all'||tag==='wrong'){
    selectedTags=new Set([tag]);
    document.querySelectorAll('.tag-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
  } else {
    selectedTags.delete('all'); selectedTags.delete('wrong');
    document.querySelector('.tag-all').classList.remove('active');
    document.querySelector('.tag-wrong').classList.remove('active');
    if(selectedTags.has(tag)){selectedTags.delete(tag);btn.classList.remove('active');}
    else{selectedTags.add(tag);btn.classList.add('active');}
    if(selectedTags.size===0){selectedTags.add('all');document.querySelector('.tag-all').classList.add('active');}
  }
}

function setN(n,btn){
  TOTAL=n;
  document.querySelectorAll('.n-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function show(id){
  const screens=['screen-home','screen-quiz','screen-result','screen-wrongnote'];
  screens.forEach(s=>{
    const el=document.getElementById(s);
    if(s===id){el.style.display='flex';el.style.visibility='visible';el.style.pointerEvents='auto';}
    else{el.style.display='none';el.style.visibility='hidden';el.style.pointerEvents='none';}
  });
}

function startQuiz(){
  let pool;
  if(selectedTags.has('wrong')){
    // 틀린 문제만
    pool = ALL_Q.filter((_,i)=>wrongCounts[i]>0);
    if(pool.length===0){alert('아직 틀린 문제가 없어요! 먼저 퀴즈를 풀어봐요 😊');return;}
    // 인덱스 보존
    pool = ALL_Q.map((q,i)=>({...q,_idx:i})).filter((_,i)=>wrongCounts[i]>0);
  } else if(selectedTags.has('all')){
    pool = ALL_Q.map((q,i)=>({...q,_idx:i}));
  } else {
    pool = ALL_Q.map((q,i)=>({...q,_idx:i})).filter(q=>selectedTags.has(q.tag));
    if(pool.length===0) pool = ALL_Q.map((q,i)=>({...q,_idx:i}));
  }
  questions = shuffle(pool).slice(0, Math.min(TOTAL, pool.length));
  current=0; score=0; answered=false; wrongQ=[];
  show('screen-quiz'); render();
}

function render(){
  if(current>=questions.length){showResult();return;}
  const q=questions[current];
  document.getElementById('hdr-num').textContent=`${current+1}/${questions.length}`;
  document.getElementById('prog').style.width=`${((current+1)/questions.length)*100}%`;
  document.getElementById('hdr-score').textContent=`${score}점`;
  document.getElementById('next-btn').style.display='none';

  const tl=q.type==='mc'?'객관식':q.type==='fill'?'빈칸 채우기':q.type==='ox'?'O / X':q.type==='mc5'?'5지선다(복수)':'서술형';
  const tc=q.type==='mc'?'chip-mc':q.type==='fill'?'chip-fill':q.type==='ox'?'chip-ox':q.type==='mc5'?'chip-mc5':'chip-essay';
  const parts=q.q.split('\n\n');
  const qtxt=parts[0], code=parts[1]||'';
  const unitName = TAG_NAMES[q.tag]||q.tag;
  const wc = q._idx!==undefined ? (wrongCounts[q._idx]||0) : 0;
  const wcBadge = wc>0 ? `<span class="wrong-count-badge">❌ ${wc}번 틀림</span>` : '';

  let body='';
  if(q.type==='mc'){
    body=`<div class="choices">${q.choices.map((c,i)=>`<button class="choice" onclick="checkMC(${i})" id="ch${i}"><span class="choice-lbl">${['A','B','C','D'][i]}</span>${c}</button>`).join('')}</div>`;
  }else if(q.type==='mc5'){
    body=`<div class="mc5-hint">※ 정답이 여러 개일 수 있어요. 해당하는 것을 모두 선택하세요.</div><div class="choices" id="mc5-choices">${q.choices.map((c,i)=>`<button class="choice-mc5" onclick="toggleMC5(${i})" id="mc5-${i}" data-sel="0"><span class="choice-lbl">${['A','B','C','D','E'][i]}</span>${c}</button>`).join('')}</div><button class="confirm-btn" id="mc5-confirm" onclick="checkMC5()" style="margin-top:10px">확인</button>`;
  }else if(q.type==='fill'){
    body=`<div class="fill-wrap"><input class="fill-input" id="fill-in" placeholder="정답 입력..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="if(event.key==='Enter')checkFill()"><button class="confirm-btn" onclick="checkFill()">확인</button></div>`;
  }else if(q.type==='essay'){
    body=`<div class="fill-wrap"><textarea class="essay-input" id="essay-in" placeholder="자유롭게 답을 서술하세요..."></textarea><button class="confirm-btn" onclick="checkEssay()">모범 답안 보기</button></div>`;
  }else{
    body=`<div class="ox-row"><button class="ox-btn" onclick="checkOX('O')" id="ox-O"><span>⭕</span><span>O</span></button><button class="ox-btn" onclick="checkOX('X')" id="ox-X"><span>❌</span><span>X</span></button></div>`;
  }

  document.getElementById('quiz-body').innerHTML=`
    <div class="unit-label">${unitName} ${wcBadge}</div>
    <span class="type-chip ${tc}">${tl}</span>
    <div class="q-text">${qtxt}</div>
    ${code?`<div class="q-code">${code}</div>`:''}
    ${body}
    <div class="feedback-box" id="fb"></div>`;
  if(q.type==='fill') setTimeout(()=>{const el=document.getElementById('fill-in');if(el)el.focus();},100);
}

function showFb(correct,q){
  const fb=document.getElementById('fb');
  fb.style.display='block';
  fb.className='feedback-box '+(correct?'correct':'wrong');
  const ans=q.type==='fill'?q.disp:q.type==='mc'?q.choices[q.ans]:q.ans;
  fb.innerHTML=`<div class="fb-title">${correct?'✅ 정답!':'❌ 오답!'}</div>${!correct?`<div class="fb-ans">정답: ${ans}</div>`:''}<div class="fb-exp">${q.exp}</div>`;
  const nb=document.getElementById('next-btn');
  nb.textContent=current+1<questions.length?'다음 문제 →':'결과 보기';
  nb.style.display='block';
}

function checkMC(i){
  if(answered)return; answered=true;
  const q=questions[current];
  [0,1,2,3].forEach(idx=>{const b=document.getElementById('ch'+idx);if(!b)return;b.disabled=true;if(idx===q.ans)b.classList.add('correct');else if(idx===i&&i!==q.ans)b.classList.add('wrong');});
  const ok=i===q.ans;
  if(ok)score++; else{ wrongQ.push(q); if(q._idx!==undefined)saveWrong(q._idx); }
  showFb(ok,q);
}
function checkFill(){
  if(answered)return; answered=true;
  const q=questions[current];
  const val=document.getElementById('fill-in').value.trim();
  const ok=q.ans.map(a=>a.toLowerCase()).includes(val.toLowerCase());
  document.getElementById('fill-in').disabled=true;
  if(ok)score++; else{ wrongQ.push(q); if(q._idx!==undefined)saveWrong(q._idx); }
  showFb(ok,q);
}
function checkOX(v){
  if(answered)return; answered=true;
  const q=questions[current];
  ['O','X'].forEach(ox=>{const b=document.getElementById('ox-'+ox);b.disabled=true;if(ox===q.ans)b.classList.add('correct');else if(ox===v&&v!==q.ans)b.classList.add('wrong');});
  const ok=v===q.ans;
  if(ok)score++; else{ wrongQ.push(q); if(q._idx!==undefined)saveWrong(q._idx); }
  showFb(ok,q);
}
function nextQ(){current++;answered=false;render();}

// ── mc5 (5지선다 복수정답) ──
let mc5Selected = new Set();
function toggleMC5(i){
  if(answered) return;
  const btn = document.getElementById('mc5-'+i);
  if(mc5Selected.has(i)){ mc5Selected.delete(i); btn.classList.remove('selected'); }
  else{ mc5Selected.add(i); btn.classList.add('selected'); }
}
function checkMC5(){
  if(answered) return; answered=true;
  const q=questions[current];
  const correctSet = new Set(q.ans);
  // 정답과 선택 비교
  const ok = mc5Selected.size === correctSet.size && [...mc5Selected].every(i=>correctSet.has(i));
  q.choices.forEach((_,i)=>{
    const btn=document.getElementById('mc5-'+i);
    if(!btn)return;
    btn.disabled=true;
    if(correctSet.has(i)) btn.classList.add('correct');
    else if(mc5Selected.has(i)&&!correctSet.has(i)) btn.classList.add('wrong');
  });
  document.getElementById('mc5-confirm').disabled=true;
  mc5Selected=new Set();
  if(ok) score++; else{ wrongQ.push(q); if(q._idx!==undefined)saveWrong(q._idx); }
  const correctLabels=[...correctSet].map(i=>['A','B','C','D','E'][i]).join(', ');
  const fb=document.getElementById('fb');
  fb.style.display='block';
  fb.className='feedback-box '+(ok?'correct':'wrong');
  fb.innerHTML=`<div class="fb-title">${ok?'✅ 정답!':'❌ 오답!'}</div>${!ok?`<div class="fb-ans">정답: ${correctLabels}</div>`:''}<div class="fb-exp">${q.exp}</div>`;
  const nb=document.getElementById('next-btn');
  nb.textContent=current+1<questions.length?'다음 문제 →':'결과 보기';
  nb.style.display='block';
}

// ── 서술형 ──
function checkEssay(){
  if(answered) return; answered=true;
  const q=questions[current];
  const textarea=document.getElementById('essay-in');
  if(textarea) textarea.disabled=true;
  score++; // 서술형은 모범답안 확인 후 자동 1점
  const fb=document.getElementById('fb');
  fb.style.display='block';
  fb.className='feedback-box correct';
  fb.innerHTML=`<div class="fb-title">📝 모범 답안</div><div class="fb-exp" style="margin-top:6px;line-height:1.8;">${q.ans}</div><div style="margin-top:8px;font-size:12px;opacity:.7">${q.exp}</div>`;
  const nb=document.getElementById('next-btn');
  nb.textContent=current+1<questions.length?'다음 문제 →':'결과 보기';
  nb.style.display='block';
}

// ══ 결과 화면 ══
function showResult(){
  saveBest(score); loadData();
  const total=questions.length, pct=Math.round(score/total*100);
  const emoji=pct===100?'🏆':pct>=80?'🌟':pct>=60?'👍':'📚';
  const msg=pct===100?'완벽해요! 만점입니다!':pct>=80?'훌륭해요! 거의 다 맞혔네요.':pct>=60?'좋아요! 조금만 더 연습하면 돼요.':'틀린 문제를 꼭 복습해봐요!';
  document.getElementById('res-emoji').textContent=emoji;
  document.getElementById('res-score').innerHTML=`${score}<span class="result-denom">/${total}</span>`;
  document.getElementById('res-pct').textContent=`정답률 ${pct}%`;
  document.getElementById('res-msg').textContent=msg;

  // ── 개념별 오답 분석 ──
  const tagWrong={}, tagTotal={};
  questions.forEach(q=>{
    const t=q.tag;
    tagTotal[t]=(tagTotal[t]||0)+1;
  });
  wrongQ.forEach(q=>{
    const t=q.tag;
    tagWrong[t]=(tagWrong[t]||0)+1;
  });

  const weakTags = Object.entries(tagWrong)
    .map(([tag,wc])=>({tag, wc, total:tagTotal[tag]||1, rate:wc/(tagTotal[tag]||1)}))
    .filter(x=>x.wc>0)
    .sort((a,b)=>b.rate-a.rate);

  let summaryHTML='';
  if(weakTags.length===0){
    summaryHTML=`<div class="concept-summary"><div class="concept-ok">🎉 모든 개념을 완벽히 이해하고 있어요!</div></div>`;
  } else {
    const items = weakTags.slice(0,6).map((x,i)=>{
      const name=TAG_NAMES[x.tag]||x.tag;
      const barW=Math.round(x.rate*100);
      const hint = {
        func:'함수 정의·return·매개변수·인수 구분',
        loop:'for/while·range·continue·break 흐름',
        basic:'None·연산자·조건문 기초',
        dict:'딕셔너리 접근·in 연산·set 집합',
        list:'append·remove·sort·2차원 리스트',
        string:'strip·join·split·문자열 메서드',
        dtype:'자료형 종류·int/float/str/bool 변환',
        flowchart:'순서도 기호·흐름 방향',
        file:'파일 읽기·Counter·with문',
        hangman:'랜덤·인덱싱·결과 비교'
      }[x.tag]||'관련 개념 복습 필요';
      return `<div class="concept-weak">
        <div class="concept-weak-header">
          <span class="concept-rank">${i+1}</span>
          <span class="concept-name">${name}</span>
        </div>
        <div class="concept-bar-wrap"><div class="concept-bar" style="width:${barW}%"></div></div>
        <div class="concept-stat">${x.wc}/${x.total}개 틀림 (오답률 ${barW}%) · ${hint}</div>
      </div>`;
    }).join('');

    const tagLinks = weakTags.slice(0,6).map((x,i)=>{
      const name=TAG_NAMES[x.tag]||x.tag;
      return `<span style="display:inline-block;background:rgba(248,113,113,.12);border:.5px solid var(--red);border-radius:99px;padding:3px 10px;font-size:11px;font-family:var(--mono);color:var(--red);margin:3px 2px;cursor:pointer;" onclick="focusTag('${x.tag}')">${i+1}. ${name}</span>`;
    }).join('');

    summaryHTML=`<div class="concept-summary">
      <div class="concept-summary-title">📊 취약 개념 분석</div>
      ${items}
      <div style="margin-top:1rem;padding-top:.875rem;border-top:.5px solid var(--border);">
        <div style="font-size:11px;color:var(--muted);font-family:var(--mono);margin-bottom:.5rem;">집중 연습 추천 태그</div>
        <div>${tagLinks}</div>
      </div>
    </div>`;
  }
  document.getElementById('concept-summary-section').innerHTML=summaryHTML;

  let wrongHTML='';
  if(wrongQ.length>0){
    wrongHTML=`
      <div class="wrong-section-header">
        <span class="wrong-section-title">틀린 문제 (${wrongQ.length}개)</span>
        <button class="select-all-btn" onclick="selectAll()">전체 선택</button>
      </div>
      <div class="wrong-items-list" id="wrong-items-list">
        ${wrongQ.map((q,i)=>{
          const unitName=TAG_NAMES[q.tag]||q.tag;
          const wc=q._idx!==undefined?(wrongCounts[q._idx]||0):0;
          const qtxt=q.q.split('\n\n')[0].slice(0,55)+(q.q.split('\n\n')[0].length>55?'...':'');
          const ans=q.type==='fill'?q.disp:q.type==='mc'?q.choices[q.ans]:q.ans;
          return `<div class="wrong-item-card" id="wcard${i}" onclick="toggleSelect(${i})">
            <div class="wrong-item-check" id="wcheck${i}"></div>
            <div class="wrong-item-content">
              <div class="wrong-item-unit">${unitName}</div>
              <div class="wrong-item-q">${qtxt}</div>
              <div class="wrong-item-cnt">누적 ${wc}번 틀림</div>
            </div>
          </div>`;
        }).join('')}
      </div>
      <button class="copy-selected-btn" id="copy-btn" onclick="copySelected()">📋 선택한 문제 Claude에게 보내기</button>`;
  }
  document.getElementById('wrong-section').innerHTML=wrongHTML;
  window._selectedWrong = new Set();
  show('screen-result');
}

function toggleSelect(i){
  const card=document.getElementById('wcard'+i);
  const check=document.getElementById('wcheck'+i);
  if(window._selectedWrong.has(i)){
    window._selectedWrong.delete(i);
    card.classList.remove('selected');
    check.textContent='';
  } else {
    window._selectedWrong.add(i);
    card.classList.add('selected');
    check.textContent='✓';
  }
  const btn=document.getElementById('copy-btn');
  if(btn) btn.className='copy-selected-btn'+(window._selectedWrong.size>0?' visible':'');
}

function selectAll(){
  wrongQ.forEach((_,i)=>{
    window._selectedWrong.add(i);
    const card=document.getElementById('wcard'+i);
    const check=document.getElementById('wcheck'+i);
    if(card) card.classList.add('selected');
    if(check) check.textContent='✓';
  });
  const btn=document.getElementById('copy-btn');
  if(btn) btn.className='copy-selected-btn visible';
}

function copySelected(){
  const sel=[...window._selectedWrong];
  if(sel.length===0){alert('문제를 선택해주세요!');return;}
  const date=new Date().toLocaleDateString('ko-KR');
  let text=`[Python 퀴즈 오답 기록 - ${date}]\n선택한 문제 ${sel.length}개\n\n`;
  sel.forEach((i,n)=>{
    const q=wrongQ[i];
    const unitName=TAG_NAMES[q.tag]||q.tag;
    const ans=q.type==='fill'?q.disp:q.type==='mc'?q.choices[q.ans]:q.ans;
    const wc=q._idx!==undefined?(wrongCounts[q._idx]||0):0;
    text+=`${n+1}. [${unitName}] ${q.q.split('\n\n')[0]}\n`;
    text+=`   정답: ${ans}\n`;
    text+=`   해설: ${q.exp}\n`;
    text+=`   누적 틀린 횟수: ${wc}번\n\n`;
  });
  text+=`---\nClaude에게: 위 오답 패턴을 분석해서 비슷한 문제를 각 문제당 3~5개씩 만들어 퀴즈 앱에 추가해주세요!`;

  navigator.clipboard.writeText(text).then(()=>{
    const btn=document.getElementById('copy-btn');
    if(btn){btn.textContent='✅ 복사됐어요! Claude에게 붙여넣기 하세요';setTimeout(()=>{btn.textContent='📋 선택한 문제 Claude에게 보내기';},3000);}
  }).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=text;
    ta.style.cssText='position:fixed;top:10%;left:5%;width:90vw;height:70vh;z-index:999;background:#1a1a24;color:#e8e8f0;border:1px solid #7c6ff7;border-radius:12px;padding:1rem;font-size:12px;';
    document.body.appendChild(ta);
    ta.select();
    const close=document.createElement('button');
    close.textContent='전체 선택 후 복사하고 닫기';
    close.style.cssText='position:fixed;top:calc(10% - 44px);left:5%;z-index:1000;padding:10px 16px;background:#7c6ff7;color:#fff;border:none;border-radius:8px;font-size:13px;width:90vw;';
    close.onclick=()=>{ta.select();document.execCommand('copy');document.body.removeChild(ta);document.body.removeChild(close);};
    document.body.appendChild(close);
  });
}

// ══ 오답 노트 ══
function showWrongNote(){
  const body=document.getElementById('note-body');
  const wrongList=ALL_Q.map((q,i)=>({...q,_idx:i,_cnt:wrongCounts[i]||0})).filter(q=>q._cnt>0).sort((a,b)=>b._cnt-a._cnt);
  if(wrongList.length===0){
    body.innerHTML=`<div class="note-empty">아직 틀린 문제가 없어요! 🎉<br>퀴즈를 풀면 여기에 기록돼요.</div>`;
  } else {
    body.innerHTML=wrongList.map(q=>{
      const unitName=TAG_NAMES[q.tag]||q.tag;
      const ans=q.type==='fill'?q.disp:q.type==='mc'?q.choices[q.ans]:q.ans;
      const qtxt=q.q.split('\n\n')[0].slice(0,60)+(q.q.split('\n\n')[0].length>60?'...':'');
      return `<div class="note-item">
        <div class="note-item-top">
          <span class="note-item-unit">${unitName}</span>
          <span class="note-item-cnt">❌ ${q._cnt}번 틀림</span>
        </div>
        <div class="note-item-q">${qtxt}</div>
        <div class="note-item-ans">정답: ${ans}</div>
      </div>`;
    }).join('');
  }
  show('screen-wrongnote');
}

function retryQuiz(){startQuiz();}
function goHome(){show('screen-home');loadData();}
function focusTag(tag){
  // 홈으로 이동 후 해당 태그 선택
  goHome();
  // 잠깐 후 태그 버튼 클릭 효과
  setTimeout(()=>{
    const btns = document.querySelectorAll('.tag-btn');
    btns.forEach(b=>b.classList.remove('active'));
    document.querySelector('.tag-all').classList.remove('active');
    document.querySelector('.tag-wrong').classList.remove('active');
    selectedTags = new Set([tag]);
    btns.forEach(b=>{
      if(b.onclick && b.onclick.toString().includes(`'${tag}'`)){
        b.classList.add('active');
        b.scrollIntoView({behavior:'smooth',block:'center'});
      }
    });
  }, 100);
}

loadData();
show('screen-home');
</script>
